<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1b3d"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Griglia"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Griglia di Partenza</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: pagina chiara con barra di navigazione in basso. Identità: targa del numero di gara (blu notte con cornice gialla), classifica a torre con la posizione su tassello scuro, schede quadrate con filo del colore della scuderia, scelte contrassegnate A, B, C come i box della griglia. */
:root{
  --bg:#f4f5f7;
  --panel:#ffffff;
  --soft:#eceef2;
  --line:#dfe2e8;
  --fg:#0d1b3d;
  --mut:#5b6478;
  --yellow:#ffd23a;
  --yellow-ink:#0d1b3d;
  --plate:#0d1b3d;
  --plate-fg:#ffffff;
  --btn-bg:#0d1b3d;
  --btn-fg:#ffffff;
  --me:#fff0b8;
  --purple:#7c4dff;
  --green:#12a150;
  --amber:#d99a00;
  --warn:#e5372f;
  --neutral:#b4bcc9;
  --good-bg:#dcf3e3;
  --shadow:0 1px 0 rgba(13,27,61,.04),0 3px 12px rgba(13,27,61,.06);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1020;--panel:#131b30;--soft:#1b2540;--line:#27325a;--fg:#eef1f9;--mut:#9ba6c2;--plate:#2a3a6b;--btn-bg:#ffd23a;--btn-fg:#0d1b3d;--me:#4a3f12;--purple:#a78bfa;--green:#34d399;--amber:#fbbf24;--warn:#f87171;--neutral:#4a5578;--good-bg:#143a2a;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1020;--panel:#131b30;--soft:#1b2540;--line:#27325a;--fg:#eef1f9;--mut:#9ba6c2;--plate:#2a3a6b;--btn-bg:#ffd23a;--btn-fg:#0d1b3d;--me:#4a3f12;--purple:#a78bfa;--green:#34d399;--amber:#fbbf24;--warn:#f87171;--neutral:#4a5578;--good-bg:#143a2a;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--body);padding-block:10px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:800;letter-spacing:-.03em}
p{margin:0}
button{font:inherit;color:inherit}
:is(button,input):focus-visible{outline:3px solid var(--yellow);outline-offset:2px;box-shadow:0 0 0 5px var(--plate)}
.home{display:flex;flex-direction:column;gap:14px;padding-top:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{flex:none;width:48px;height:48px}
.wm{font-size:clamp(26px,8vw,34px);line-height:1}
.tagline{color:var(--mut);font-size:14px;max-width:34ch}
.links{display:flex;flex-direction:column;gap:8px}
.link{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;width:100%;box-shadow:var(--shadow)}
.link:hover{border-color:var(--fg)}
.link .pos{background:var(--yellow);color:var(--yellow-ink);font:800 13px var(--display);padding:6px 8px;border-radius:6px;min-width:38px;text-align:center}
.link b{display:block;font:700 15px var(--display);letter-spacing:-.02em}
.link small{color:var(--mut);font-size:12.5px}
.link i{font-style:normal;font-size:20px;color:var(--mut)}
.foot{color:var(--mut);font-size:12px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;gap:4px;background:var(--panel);border-top:1px solid var(--line);padding:4px max(12px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.nav>*{max-width:140px}

.plate.xs{min-width:40px;height:32px;font-size:18px;outline-offset:-3px;padding:0 6px;border-radius:6px;flex:none}
.hn{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}

.ovr{display:flex;align-items:baseline;gap:6px;background:var(--yellow);color:var(--yellow-ink);padding:3px 10px;border-radius:8px;flex:none}
.ovr.age{background:var(--plate);color:var(--plate-fg)}
.ovr.age small{color:var(--yellow)}
.ovr small{font:800 10px var(--body);letter-spacing:.1em}
.ovr b{font:800 21px var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pane{display:flex;flex-direction:column;gap:10px}
.kick{font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.ph h1{font-size:22px;line-height:1.1}
.ph p{color:var(--mut);margin-top:4px;font-size:14px;max-width:46ch}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.seg{height:7px;background:var(--line);border-radius:3px}
.seg.win{background:var(--purple)}.seg.pod{background:var(--green)}.seg.pts{background:var(--amber)}.seg.none{background:var(--neutral)}.seg.dnf{background:var(--warn)}
.seg.now{background:var(--fg);opacity:.3}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mut)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);animation:in .2s ease-out}

.opts{display:grid;gap:7px}

.ch.sel{border-color:var(--fg);background:var(--soft)}
.lt{width:26px;height:26px;border-radius:6px;background:var(--yellow);color:var(--yellow-ink);font:800 13px var(--display);display:grid;place-items:center}
.cb{display:flex;flex-direction:column;gap:2px;min-width:0}
.ot{font:700 15px/1.2 var(--display);letter-spacing:-.02em}

.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.tg{font:600 11px var(--body);padding:1px 6px;border:1px solid var(--line);border-radius:6px;color:var(--mut)}
.tg.r0{color:var(--green)}.tg.r1{color:var(--amber)}.tg.r2{color:var(--warn)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font:700 12px var(--body);padding:2px 7px;border-radius:6px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip.up{color:var(--green)}.chip.down{color:var(--warn)}.chip.pt{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
.dock{position:sticky;bottom:calc(60px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;pointer-events:none;margin-top:4px}
.dock>*{pointer-events:auto}
@supports (-webkit-touch-callout:none){body{min-height:calc(100vh + 1px)}}
.go{flex:1;background:var(--btn-bg);color:var(--btn-fg);border:0;border-radius:10px;padding:12px 16px;font:800 15px var(--display);letter-spacing:-.01em;cursor:pointer;box-shadow:0 6px 20px rgba(13,27,61,.25)}
.go.yel{background:var(--yellow);color:var(--yellow-ink)}
.go:disabled{opacity:.4;cursor:not-allowed}
.back{background:var(--panel);border:1.5px solid var(--fg);color:var(--fg);border-radius:10px;padding:10px 16px;font:800 15px var(--display);cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:6px 10px;font:600 12px var(--body);cursor:pointer;align-self:flex-start}
.ghost:hover{color:var(--fg);border-color:var(--fg)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.resrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.big{font:800 44px/1 var(--display);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.k-win{color:var(--purple)}.k-pod{color:var(--green)}.k-pts{color:var(--amber)}.k-none{color:var(--mut)}.k-dnf{color:var(--warn)}
.tw{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:28px 4px minmax(0,1fr) auto;gap:8px;align-items:center;padding:4px 6px;border-bottom:1px solid var(--line);font-size:13.5px}

.sq{width:4px;height:16px;border-radius:2px;background:var(--c);display:inline-block}
.nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.gp{font-weight:400;font-size:10.5px;color:var(--mut);opacity:.6;margin-right:7px}
.pt{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.row.me{background:var(--me);border-radius:8px;border-bottom-color:transparent;font-weight:700}

.row.gap{grid-template-columns:1fr;text-align:center;color:var(--mut);padding:2px;border:0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
input[type=text],input[type=search]{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--fg);font:600 15px var(--body);width:100%}
input:focus{border-color:var(--fg)}
.idgrid{display:grid;grid-template-columns:minmax(0,1fr) 78px;gap:8px}
.plate{align-self:flex-start;min-width:76px;height:52px;padding:0 10px;border-radius:8px;background:var(--plate);color:var(--yellow);display:grid;place-items:center;font:800 30px var(--display);letter-spacing:-.04em;outline:2px solid var(--yellow);outline-offset:-5px}
.plate.empty{color:var(--mut)}
.plate.sm{min-width:56px;height:44px;font-size:22px;outline-offset:-4px;flex:none}
.ctys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;max-height:230px;overflow-y:auto;padding:2px}
.cty{display:flex;align-items:center;gap:10px;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;text-align:left;cursor:pointer;min-width:0}

.cty.sel{border-color:var(--fg);background:var(--soft);font-weight:700}
.fl{font-size:17px;flex:none}
.idrow{display:flex;gap:10px;align-items:center}
.idtxt{min-width:0}

.sub{color:var(--mut);font-size:12.5px}
.srs{display:flex;flex-direction:column;gap:7px}
.sr{display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:end}

.bar{height:6px;background:var(--soft);border-radius:2px;overflow:hidden}

.dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}

.dl div:nth-last-child(-n+3){border-bottom:0}
.dl b{display:block;font:800 19px/1.1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}

.stack{display:flex;flex-direction:column;gap:9px}
.offer{display:flex;flex-direction:column;gap:7px;text-align:left;background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:10px;padding:9px 12px 11px;cursor:pointer;width:100%;box-shadow:var(--shadow)}

.oft{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

.ser{font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);white-space:nowrap;padding-top:2px}

.kd{font:800 11px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;display:inline-block;margin-right:6px}

.sb{padding:9px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.sbt{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sbt b{font:800 15px/1.15 var(--display);letter-spacing:-.02em}
.pp{font:800 15px var(--display);background:var(--soft);padding:2px 8px;border-radius:6px;flex:none}
.pp.ok{background:var(--good-bg);color:var(--green)}
.mini{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}

.lst{display:flex;flex-direction:column;gap:3px;font-size:12.5px}

.chipm{display:inline-flex;gap:6px;align-items:center}
.dt{width:4px;height:12px;border-radius:2px;background:var(--c);display:inline-block;flex:none}
.news{font-size:12.5px;color:var(--mut);border-top:1px solid var(--line);padding-top:5px}
.empty{color:var(--mut);text-align:center;padding:24px 12px;font-size:13px}

.ccat.no{opacity:.5}.sect2{margin-top:14px;font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.tblwrap{overflow-x:auto}

td.n{font-variant-numeric:tabular-nums}
.card{border-left:4px solid var(--yellow)}

.ovr{box-shadow:0 2px 8px rgba(255,210,58,.35)}

.st.s1{background:var(--yellow);color:var(--yellow-ink)}
.gt{display:block}.gt.mine{border:2px solid var(--yellow);background:rgba(255,214,0,.12);border-radius:12px;padding:8px 10px 2px;margin:4px -4px}

.achg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.ach{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12px;opacity:.5}

function makeOffers(){
  const L=[];
  const nt=x=>TIERS[x].teams.length;
  const add=(tier,rank,note)=>{
    rank=clamp(Math.round(rank),0,nt(tier)-1);
    if(L.some(o=>o.tier===tier&&o.rank===rank))return;
    L.push({tier,rank,note});
  };
  if(S.first){add(0,1,'Accademia');add(0,4,'Accademia');add(0,8,'Accademia');return L}
  const t=S.tier,pos=S.lastPos,n=2*nt(t);
  const v=.45*((n-pos)/(n-1)*100)+.2*S.fama+.2*rating(S)+.15*S.team+(S.age<25?(25-S.age)*.4:0)-(S.age>34?(S.age-34)*2.5:0)+(S.med-50)*.05+(S.soc-50)*.03+mdImg();
  const best=(vv,tier)=>clamp(Math.round((90-vv)/7*(nt(tier)-1)/9),0,nt(tier)-1);
  if(t<3&&pos<=6){
    const r=best(v-6,t+1);
    add(t+1,r+1,'Promozione');
    add(t+1,r+3,'Promozione');
  }
  add(t,best(v,t),'Rinnovo o nuova squadra');
  add(t,best(v,t)+2,'Nuova squadra');
  if(t===3)add(t,best(v,t)+4,'Squadra di fondo gruppo');
  if(t>0&&v<34)add(t-1,best(v,t-1)-1,'Un passo indietro');
  if(pos===1&&t<3)add(t+1,1,'Il campione è richiesto');
  if(pos===1&&t===3)add(t,0,'Il team campione ti vuole');
  L.sort((a,b)=>b.tier-a.tier||a.rank-b.rank);
  return ctOffers(L.slice(0,4));
}

 {t:'Fisioterapia e riposo',d:'Salti il lavoro extra, tutto in sicurezza.',fx:{costanza:2,ritmo:-1},out:'Due giorni di terapia e torni come nuovo.'},
 {t:'Stringi i denti',d:'Rischi di peggiorare.',fx:{ritmo:3},ch:.55,sm:{mod:.5,frac:.4},out:'Il dolore passa nel riscaldamento: sei carico.',alt:{fx:{costanza:-3,ritmo:-1},sm:{mod:-.8,frac:.5},out:'La schiena cede a metà weekend: guidi in apnea.'}},
 {t:'Chiedi un sedile nuovo',d:'Il team deve rifare la scocca.',fx:{team:-2,tecnica:2},out:'Il team rifà il sedile in una notte: sei comodo, ma qualcuno borbotta.'}]},
{id:'n_flu',t:'Febbre alla vigilia',x:'Ti svegli con 38 di febbre il giorno prima delle prove.',o:[
 {t:'Resta a letto',d:'Il medico del team ti segue.',fx:{costanza:1,team:1},out:'Una giornata di riposo e la febbre scende.'},
 {t:'Vai in pista lo stesso',d:'Un azzardo tra carisma e debolezza.',fx:{fama:3},ch:.4,out:'Corri con la febbre e il paddock ti applaude.',alt:{fx:{ritmo:-2,costanza:-2},sm:{mod:-1,frac:.5},out:'La febbre ti toglie lucidità: weekend in salita.'}},
 {t:'Chiama un pilota di riserva ai simulatori',d:'Ti fai sostituire nel lavoro dati.',fx:{team:-2,tecnica:1},out:'Il riserva fa il lavoro dati al posto tuo. Il team prende nota.'}]},
{id:'n_lugg',t:'La valigia non arriva',x:'Il tuo bagaglio con tuta, scarpe e casco è finito a mille chilometri di distanza.',o:[
 {t:'Usa il materiale di scorta',d:'Non perfetto, ma si corre.',fx:{costanza:2},out:'Scarpe una taglia più grande, ma la testa è a posto.'},
 {t:'Fai un post ironico',d:'I social adorano le disgrazie in diretta.',fx:{soc:4,fama:1},out:'Il tuo post sulla valigia fa il giro dei social.'},
 {t:'Pretendi un volo privato',d:'Il team non gradisce lo spreco.',fx:{team:-3,tecnica:1},ch:.5,out:'Il casco arriva in tempo, il conto no.',alt:{fx:{team:-5},out:'Il volo non basta: perdi la prima sessione e la fiducia del team.'}}]},
{id:'n_food',t:'Cena sbagliata',x:'Un ristorante consigliato da un amico ti lascia con lo stomaco in subbuglio.',o:[
 {t:'Dichiara tutto al team',d:'Meglio chiedere aiuto subito.',fx:{team:1,costanza:1},out:'Il medico ti rimette in sesto in tempo per le prove.'},
 {t:'Nascondi il problema',d:'Non vuoi mostrare debolezza.',fx:{costanza:2},ch:.5,out:'Passa in fretta e nessuno se ne accorge.',alt:{fx:{costanza:-3,ritmo:-1},sm:{mod:-.8,frac:.4},out:'In pista i crampi tornano. Il box scopre tutto.'}},
 {t:'Ci scherzi sui social',d:'Autoironia e simpatia.',fx:{soc:3,med:1},out:'«Mai più sushi il venerdì». I fan sorridono.'}]},
{id:'n_flight',t:'Volo cancellato',x:'Lo sciopero degli aerei ti blocca. Il circuito è a sei ore di macchina.',o:[
 {t:'Affitta un\'auto e guida di notte',d:'Arrivi stanco ma in tempo.',fx:{costanza:-1,fama:1},out:'Arrivi all\'alba, ma arrivi.'},
 {t:'Aspetta il volo successivo',d:'Rischi di perdere la prima sessione.',fx:{team:-2,costanza:2},out:'Perdi le libere ma arrivi riposato.'},
 {t:'Viaggia col furgone dei meccanici',d:'Una notte di racconti e panini.',fx:{team:5,tecnica:1,costanza:-1},out:'La notte in furgone ti avvicina al box più di mille riunioni.'}]},
{id:'n_move',t:'Dove vivi?',x:'Il team ti consiglia di spostarti vicino alla fabbrica. A casa tua però si sta bene.',tmin:1,o:[
 {t:'Trasloco vicino alla sede',d:'Più tempo con gli ingegneri.',fx:{team:4,tecnica:2,costanza:-1},out:'Ti trasferisci vicino alla fabbrica: ogni giorno è un po\' più squadra.'},
 {t:'Resta dove sei',d:'Stabilità prima di tutto.',fx:{costanza:3},out:'Casa è casa: la tua serenità è il tuo vantaggio.'},
 {t:'Una base in un paese fiscalmente comodo',d:'Se ne parla sui giornali.',fx:{fama:2,med:-2,team:1},out:'Il tuo trasloco divide la stampa.'}]},
{id:'n_nutr',t:'Il nutrizionista',x:'Un nutrizionista propone di rivedere la dieta per la stagione.',o:[
 {t:'Piano rigido',d:'Più peso forma, meno gusto.',fx:{costanza:3,ritmo:1,fama:-1},out:'Sei asciutto e preciso, ma di pasta ne vedi poca.'},
 {t:'Piano flessibile',d:'Equilibrio e buon umore.',fx:{costanza:2,team:1},out:'Mangi bene e dormi meglio.'},
 {t:'Ignora i consigli',d:'Sei fatto così.',fx:{talento:1,costanza:-2},out:'Il nutrizionista alza le spalle, tu pure.'}]},
{id:'n_jet',t:'Fuso orario',x:'Una trasferta lunga ti ha stravolto il sonno.',tmin:2,o:[
 {t:'Arrivi con tre giorni d\'anticipo',d:'Il tuo corpo si adatta.',fx:{costanza:3},out:'Arrivi presto e il jet lag è già un ricordo.'},
 {t:'Melatonina e allenamento',d:'Un metodo da atleti.',fx:{costanza:2,ritmo:1},out:'Ti sincronizzi in fretta.'},
 {t:'Vai direttamente in pista',d:'Il tuo vantaggio è la sorpresa.',fx:{ritmo:2},ch:.45,out:'Il tuo corpo regge: giri puliti.',alt:{fx:{costanza:-3,ritmo:-1},out:'Ti si chiudono gli occhi nel pomeriggio: giornata persa.'}}]},
{id:'n_kartacc',t:'Caduta in kart',x:'In allenamento perdi il controllo del kart e finisci contro le gomme. Niente di rotto, ma l\'orgoglio sì.',tmax:2,o:[
 {t:'Riprova subito',d:'Chi cade si rialza.',fx:{costanza:1,talento:1},ch:.6,out:'Riprendi il ritmo al primo giro.',alt:{fx:{costanza:-2},out:'Un secondo errore: la fiducia vacilla per qualche giorno.'}},
 {t:'Analizza con il coach',d:'Capire cosa è successo.',fx:{tecnica:3},out:'Scopri un errore di frenata che ripetevi da mesi.'},
 {t:'Pausa di una settimana',d:'Per ricaricare le pile.',fx:{costanza:2,ritmo:-1},out:'Una pausa breve: la testa ringrazia.'}]},
{id:'n_pet',t:'Il tuo cane in paddock',x:'Un cucciolo adottato di recente si è infilato nel garage. Tutti lo adorano.',o:[
 {t:'Lo tieni con te per il weekend',d:'Atmosfera più leggera.',fx:{team:3,soc:3},out:'Il cane diventa la mascotte del box.'},
 {t:'Lo riporti subito a casa',d:'Regole del paddock.',fx:{costanza:1},out:'Meglio non mescolare lavoro e cucciolo.'},
 {t:'Pubblica una foto',d:'I social impazziscono.',fx:{soc:5,fama:1,med:-1},out:'La foto con il cane vale più dei tuoi ultimi tre podi.'}]},
{id:'n_bday',t:'Compleanno nel paddock',x:'Oggi compi gli anni. Il team ti ha preparato qualcosa.',o:[
 {t:'Festeggia con tutti',d:'Una torta e due battute.',fx:{team:4,soc:2},out:'Il box canta tutto insieme: un bel momento.'},
 {t:'Resta in camera a studiare i dati',d:'Gli anni passano, la pista resta.',fx:{tecnica:2,costanza:1,team:-1},out:'Il tuo ingegnere ti manda una torta in camera.'},
 {t:'Posta il video del box',d:'Autenticità e simpatia.',fx:{soc:4,fama:1},out:'Il video del compleanno raccoglie migliaia di auguri.'}]},
{id:'n_thief',t:'Il casco scambiato',x:'Un casco identico al tuo finisce in mano a un altro pilota. Uno scambio imbarazzante.',o:[
 {t:'Telefona al pilota',d:'Una chiacchierata tra colleghi.',fx:{fama:1,med:2},out:'Vi rimandate i caschi: stretta di mano e foto.'},
 {t:'Chiedi il casco a un meccanico',d:'Rapido, ma poco elegante.',fx:{team:-1,costanza:1},out:'Il casco di scorta è un po\' stretto.'},
 {t:'Pubblica una sfida ironica',d:'Più rumore che sostanza.',fx:{soc:4},ch:.6,out:'La storia diventa un piccolo caso virale.',alt:{fx:{med:-3,soc:1},out:'L\'ironia viene fraintesa: «montato di testa», scrive un giornale.'}}]},
{id:'n_drone',t:'Foto rubate nel paddock',x:'Un drone ha ripreso la tua riunione privata nel motorhome.',tmin:1,o:[
 {t:'Denuncia',d:'Difendi la tua riservatezza.',fx:{team:2,med:1},out:'Il team ti sostiene e le immagini spariscono.'},
 {t:'Ignora',d:'Meglio non dare importanza.',fx:{},out:'Il caso si spegne da solo.'},
 {t:'Usa l\'episodio per un post ironico',d:'Rischioso ma divertente.',fx:{soc:4,team:-2},out:'Il tuo post ironico divide: c\'è chi ride e chi si arrabbia.'}]},
/* formazione, mentori, ingegneri */
{id:'n_mentor',t:'Il consiglio di un ex campione',x:'Un campione del mondo ritirato ti invita a cena e ti offre un\'ora di consigli.',tmin:1,o:[
 {t:'Chiedi della testa',d:'Come si gestisce la pressione.',fx:{costanza:4},out:'«Vincere è una questione di nervi», ti dice. E ti salva un mese.'},
 {t:'Chiedi delle traiettorie',d:'Un manuale di guida a mano libera.',fx:{talento:2,tecnica:2},out:'Disegna tutto su un tovagliolo. Lo conservi.'},
 {t:'Chiedi di contatti',d:'Il suo numero vale oro.',fx:{fama:3,team:1},out:'Ti presenta a due dirigenti. Una porta si apre.'}]},
{id:'n_eng',t:'Nuovo ingegnere di pista',x:'Il tuo ingegnere cambia. Il nuovo è giovane, ambizioso e molto diretto.',tmin:1,o:[
 {t:'Costruisci subito intesa',d:'Cene e ore di dati insieme.',fx:{tecnica:3,team:2},out:'Parlate la stessa lingua dopo due settimane.'},
 {t:'Mantieni le distanze',d:'Fiducia da guadagnare.',fx:{costanza:1},out:'Ci vorrà un po\', ma c\'è rispetto.'},
 {t:'Chiedi di tenere il vecchio',d:'Rischi di creare tensione.',fx:{team:-3,costanza:2},ch:.4,out:'Il team cede: il vecchio resta con te.',alt:{fx:{team:-5},out:'Il team rifiuta e il tuo rapporto con il nuovo parte in salita.'}}]},
{id:'n_radio',t:'Rimproveri via radio',x:'Il tuo ingegnere ti riprende a muso duro alla radio dopo un errore. L\'audio finisce in tv.',tmin:1,o:[
 {t:'Rispondi per le rime',d:'Spettacolo, ma il box sbuffa.',fx:{fama:3,team:-3,soc:2},out:'Il tuo tono accende gli animi, e i post.'},
 {t:'Accetta e basta',d:'Maturità.',fx:{team:2,costanza:2},out:'Il box ti guarda con più rispetto.'},
 {t:'Parlane dopo la gara',d:'In privato.',fx:{team:3,tecnica:1},out:'Dopo la gara vi chiarite davanti a un caffè.'}]},
{id:'n_acad',t:'Visita all\'accademia di un top team',x:'Un grande team ti invita per un giorno nella sua accademia giovanile.',tmax:1,o:[
 {t:'Accetti e ti metti in mostra',d:'Una vetrina da non perdere.',fx:{fama:4,tecnica:1},out:'Gli osservatori prendono appunti su di te.'},
 {t:'Accetti e osservi',d:'Impari come lavorano i professionisti.',fx:{tecnica:3,costanza:1},out:'Torni con un taccuino pieno.'},
 {t:'Rifiuti per impegni',d:'Resti dove sei.',fx:{team:2},out:'Il tuo team apprezza la fedeltà.'}]},
{id:'n_vet',t:'Un veterano ti dà il benvenuto',x:'Un pilota di lungo corso ti ferma nel paddock: «Facciamo due chiacchiere».',tmax:2,o:[
 {t:'Ascolti e basta',d:'Rispetto e curiosità.',fx:{costanza:2,med:2},out:'Ti racconta di come ha sbagliato in gioventù.'},
 {t:'Gli chiedi di un duello',d:'Voglia di confrontarti.',fx:{ritmo:2,fama:2},out:'Un duello a parole che finisce a ridere.'},
 {t:'Lo sfidi in pista',d:'Ti fai notare.',fx:{talento:2,team:-1},ch:.5,out:'Vi scambiate sorpassi puliti in prova: il paddock se ne accorge.',alt:{fx:{fama:-1,costanza:-2},out:'Ti passa con una manovra da maestro. Lezione ricevuta.'}}]},
{id:'n_young',t:'Il più giovane del paddock',x:'Tutti ti guardano come la nuova promessa. Un po\' di pressione non guasta.',c:()=>S.age<=19,o:[
 {t:'Sfrutta l\'etichetta',d:'Più riflettori, più attese.',fx:{fama:4,costanza:-1},out:'Il tuo nome inizia a girare nel paddock.'},
 {t:'Resta umile',d:'Prima si lavora.',fx:{team:3,costanza:1},out:'Il team ti riconosce una maturità rara.'},
 {t:'Fai il simpatico con i giornalisti',d:'Il pubblico ti adora.',fx:{med:3,soc:2},out:'Il tuo sorriso conquista i media.'}]},
{id:'n_old',t:'L\'età è solo un numero?',x:'Un giornalista scrive che sei vicino al tramonto. Il tuo ingegnere ti guarda.',c:()=>S.age>=31,o:[
 {t:'Rispondi in pista',d:'Il cronometro non ha età.',fx:{ritmo:2,costanza:1},out:'Il tuo ritmo zittisce i critici.'},
 {t:'Rispondi con ironia',d:'Leggerezza e carisma.',fx:{soc:3,med:2},out:'La tua battuta fa il giro dei social.'},
 {t:'Cambia preparazione',d:'Un piano più moderno.',fx:{costanza:3,tecnica:1},out:'Il nuovo programma ti ridà brillantezza.'}]},
/* tecnico e sviluppo */
{id:'n_floor',t:'Un nuovo fondo da provare',x:'Il reparto aerodinamica ha un fondo nuovo, mai provato in pista. Lo vuoi sulla tua macchina?',tmin:1,o:[
 {t:'Montalo subito',d:'Un azzardo.',fx:{car:.8},ch:.55,out:'Il fondo funziona: la macchina è un\'altra.',alt:{fx:{car:-.5,team:-1},sm:{mod:-.7,frac:.4},out:'Il fondo è instabile: si torna al vecchio con la coda tra le gambe.'}},
 {t:'Prova solo al venerdì',d:'Raccogli dati senza rischio.',fx:{car:.3,tecnica:2},out:'I dati del venerdì sono preziosi.'},
 {t:'Aspetta la prossima gara',d:'Prudenza.',fx:{costanza:1},out:'Aspetti. Il fondo arriverà con calma.'}]},
{id:'n_wtunnel',t:'Giornata in galleria del vento',x:'Sei invitato a passare una giornata nel reparto aerodinamico.',tmin:2,o:[
 {t:'Resta tutto il giorno',d:'Capisci come nasce la macchina.',fx:{tecnica:4,team:2},out:'Capisci perché la tua macchina si comporta così.'},
 {t:'Passa solo la mattina',d:'Bilanci le attività.',fx:{tecnica:2},out:'Ti serve una mattina per portarti a casa metà del sapere.'},
 {t:'Rimanda',d:'Troppo da fare.',fx:{costanza:1},out:'Magari un\'altra volta.'}]},
{id:'n_tyre',t:'Test gomme',x:'Il fornitore di gomme cerca un pilota per un test fuori programma.',o:[
 {t:'Offriti volontario',d:'Mescole e giri infiniti.',fx:{tecnica:3,costanza:-1},sm:{mod:.4,frac:.6},out:'Impari come le gomme si degradano.'},
 {t:'Lascia fare al compagno',d:'Preservi le energie.',fx:{costanza:2},out:'Un riposo che ti serve.'},
 {t:'Scegli la mescola più dura',d:'Più sicuro per te, meno per i dati.',fx:{tecnica:1,team:-1},out:'Il fornitore apprezza poco la scelta.'}]},
{id:'n_budget',t:'Taglio al budget',x:'Il team annuncia tagli ai costi. Si vocifera di pacchetti di sviluppo rinviati.',tmin:1,o:[
 {t:'Offri di rinunciare a un test',d:'Un gesto di squadra.',fx:{team:4,car:-.2},out:'Il team ti ricorda come il pilota che ha dato una mano.'},
 {t:'Chiedi garanzie',d:'Vuoi sapere che succede.',fx:{team:-1,tecnica:1},out:'Ottieni la promessa che gli aggiornamenti restano.'},
 {t:'Cerca fondi tra i tuoi sponsor',d:'Un aiuto concreto.',fx:{fama:2,car:.3,team:3},ch:.5,out:'Il tuo sponsor mette sul tavolo un contributo.',alt:{fx:{fama:-1,team:-1},out:'Lo sponsor si tira indietro e ci rimetti la faccia.'}}]},
{id:'n_fact',t:'Visita in fabbrica',x:'Sei invitato a salutare i meccanici e gli ingegneri che costruiscono la tua macchina.',tmin:1,o:[
 {t:'Offri il pranzo a tutti',d:'Un gesto semplice.',fx:{team:5},out:'I ragazzi della fabbrica parlano di te per giorni.'},
 {t:'Passa il giorno con l\'aerodinamica',d:'Un po\' di lavoro serio.',fx:{tecnica:2,car:.2},out:'Torni con idee nuove e un\'amicizia in più.'},
 {t:'Vai a fare qualche foto',d:'Un contenuto per i social.',fx:{soc:3,team:1},out:'Il tuo reportage dalla fabbrica va forte.'}]},
{id:'n_boss',t:'Il team principal sotto pressione',x:'I risultati del team calano e il capo è nervoso. Ti convoca nel suo ufficio.',tmin:1,o:[
 {t:'Offri sostegno',d:'Fai il pompiere.',fx:{team:5,pri:3},out:'Il capo ricorda chi gli è stato accanto nei momenti difficili.'},
 {t:'Chiedi più risorse',d:'È il momento di farsi sentire.',fx:{car:.4,team:-2},out:'Ottieni un po\' di budget in più, ma non la simpatia.'},
 {t:'Mantieni la calma',d:'Non è affar tuo.',fx:{costanza:2},out:'Alzi le spalle e ti concentri sul tuo lavoro.'}]},
{id:'n_newaero',t:'Un nuovo aerodinamico in squadra',x:'Il team ha ingaggiato un capo aerodinamico famoso. Vuole sentire il tuo parere.',tmin:2,o:[
 {t:'Sii preciso e tecnico',d:'Una descrizione puntuale.',fx:{tecnica:2,car:.3},out:'Il nuovo capo prende appunti e sorride.'},
 {t:'Sii emotivo: racconta le sensazioni',d:'Un linguaggio meno tecnico.',fx:{talento:2,car:.2},out:'Descrivi la macchina come una persona. A lui piace.'},
 {t:'Non rispondere',d:'Lasci spazio agli altri.',fx:{},out:'Resti in silenzio e nessuno se la prende.'}]},
{id:'n_penal',t:'Convocazione dai commissari',x:'I commissari sportivi ti convocano per un episodio dell\'ultima gara.',tmin:1,o:[
 {t:'Difendi le tue ragioni',d:'Una linea dura, un tono pacato.',fx:{fama:1},ch:.5,out:'Le tue ragioni convincono: nessuna sanzione.',alt:{fx:{team:-2,fama:-1},sm:{mod:-.6,frac:.3},out:'Ti danno cinque secondi di penalità e la tua difesa fa ridere.'}},
 {t:'Chiedi scusa',d:'Una risposta composta.',fx:{med:2,team:1},out:'Un richiamo ufficiale e niente di più.'},
 {t:'Porta un esperto',d:'Il team ti manda l\'avvocato.',fx:{team:2},out:'Il tuo avvocato fa il suo lavoro: nulla da segnalare.'}]},
{id:'n_prot',t:'Il team presenta reclamo',x:'Dopo la gara il team vuole presentare reclamo contro un rivale. Servirebbe la tua testimonianza.',tmin:1,o:[
 {t:'Testimonia',d:'Rischi di inimicarti il paddock.',fx:{team:4,med:-1},out:'La tua testimonianza pesa: il team ti ringrazia.'},
 {t:'Resta neutrale',d:'Dici di non aver visto tutto.',fx:{med:2},out:'Eviti di schierarti. Qualcuno storce il naso.'},
 {t:'Sostieni il rivale',d:'Rischioso.',fx:{fama:2,team:-5},out:'Il paddock lo apprezza, il tuo box molto meno.'}]},
{id:'n_wet',t:'Pista allagata',x:'Le prime libere sono cancellate per pioggia torrenziale. Il team propone un\'uscita di prova comunque.',o:[
 {t:'Esci e fai giri di prova',d:'Capisci la pista nel bagnato.',fx:{tecnica:2,ritmo:1},ch:.7,out:'Impari dove tenere i gas.',alt:{fx:{costanza:-2},sm:{mod:-.4,frac:.3},out:'Un testacoda ti toglie fiducia.'}},
 {t:'Resta nel box',d:'Non rischiare per nulla.',fx:{costanza:2},out:'Il tempo passa tra una battuta e un caffè.'},
 {t:'Studia il video onboard',d:'Una sessione tecnica al chiuso.',fx:{tecnica:3},out:'Passi due ore a guardare onboard sotto la pioggia.'}]},
{id:'n_heat',t:'Caldo estremo',x:'Il termometro segna 41 gradi in pista. L\'abitacolo è una sauna.',o:[
 {t:'Allenamento termico',d:'Ti prepari al caldo.',fx:{costanza:3,ritmo:-1},out:'Il tuo corpo si abitua e il weekend è più semplice.'},
 {t:'Gilet refrigerante',d:'Un aiuto prezioso.',fx:{costanza:2,team:1},out:'Un\'attrezzatura che fa la differenza.'},
 {t:'Resisti con la grinta',d:'Un po\' macho.',fx:{talento:1},ch:.45,out:'Reggi bene e ti guadagni stima.',alt:{fx:{costanza:-3},sm:{mod:-.6,frac:.3},out:'Il caldo ti piega: ultimi giri in apnea.'}}]},
{id:'n_walk',t:'Ricognizione a piedi',x:'Un ingegnere ti propone di camminare tutta la pista prima delle prove.',o:[
 {t:'Cammina e prendi appunti',d:'Impari ogni dosso.',fx:{tecnica:3},out:'Scopri una linea nuova alla chicane.'},
 {t:'Vai in bici',d:'Più leggero, meno dettagli.',fx:{tecnica:1,costanza:1},out:'Un giro in bici tra le curve.'},
 {t:'Studia solo dal simulatore',d:'Il tuo metodo.',fx:{tecnica:2,costanza:-1},out:'Il simulatore non ti dice tutto, ma ti dice abbastanza.'}]},
{id:'n_slump',t:'Un periodo no',x:'Gli ultimi risultati ti hanno scavato dentro. Il tuo preparatore mentale vuole parlarti.',c:()=>lastK()==='none'||lastK()==='dnf',o:[
 {t:'Parlane apertamente',d:'Una lunga chiacchierata.',fx:{costanza:3,team:1},out:'Dopo averne parlato, il peso è già più leggero.'},
 {t:'Allenati di più',d:'Più ore, meno pensieri.',fx:{ritmo:2,costanza:-1},out:'Il lavoro duro ti libera la testa.'},
 {t:'Stacca per un weekend',d:'Una pausa dai social e dal lavoro.',fx:{costanza:2,soc:-2},out:'Ti sparisci un weekend, e torni con occhi nuovi.'}]},
{id:'n_hot',t:'Sei in un momento magico',x:'Dopo l\'ultima gara tutto sembra riuscirti. Il tuo ingegnere ti consiglia di non strafare.',c:()=>lastK()==='win'||lastK()==='pod',o:[
 {t:'Continua a spingere',d:'Cavalca l\'onda.',fx:{ritmo:2,talento:1},out:'Sei in trance sportiva: tutto fila liscio.'},
 {t:'Resta con i piedi per terra',d:'Prudenza.',fx:{costanza:3},out:'Fai tesoro dei consigli e lavori sui dettagli.'},
 {t:'Chiedi un aumento di status',d:'Il momento è ideale.',fx:{pri:6,team:-1},out:'Il team ti riconosce un ruolo più centrale.'}]},
{id:'n_champ',t:'Il leader della classifica ti provoca',x:'Il pilota in testa dice di non temere nessuno, e ti guarda negli occhi.',c:()=>S.round>=3,tmin:1,o:[
 {t:'Rispondi con una frecciata',d:'Fai alzare la temperatura.',fx:{fama:3,soc:3,med:-1},out:'La frecciata ti dà visibilità: ti ascoltano tutti.'},
 {t:'Sorridi e vai via',d:'Non ti fai trascinare.',fx:{costanza:2,med:2},out:'Il tuo sangue freddo colpisce il paddock.'},
 {t:'Ti prepari al duello',d:'Riguardi i suoi giri uno a uno.',fx:{tecnica:2,ritmo:1},out:'Studi le sue traiettorie: conosci i suoi punti deboli.'}]},

      pick(['Il piano regge, perdiamo qualcosa ma niente di grave.','Sul ritmo ci siamo, la strategia è accettabile.']),
      pick(['Qualcosa non torna: i rivali hanno scelto meglio di noi.','I rivali stanno guadagnando: la strategia ci costa tempo.']),

  if(S.riv){const rv=main.order.find(e=>e.n===S.riv.n);if(rv&&!rv.dnf&&!me.dnf&&Math.abs(rv.pos-me.pos)<=2)add(.85,'Muretto',S.riv.n+' è nelle tue scie: non regalargli niente.')}

    win:pick(['Bandiera a scacchi: hai vinto! Grazie ragazzi, che gara!','P1! Ce l\'abbiamo fatta, grande, grande gara!']),

  out.sort((a,b)=>a.l-b.l);
  while(out.length>6){const i=out.findIndex((x,k)=>k>0&&k<out.length-1&&x.w==='Team');out.splice(i>0?i:out.length-2,1)}

function ensureSh(){

  const sh={y:S.year,tier:S.tier,T:{}};
  [0,1,2,3].forEach(i=>{
    if(i===S.tier)return;
    const Tt=TIERS[i],rows={};
    for(let t=0;t<Tt.teams.length;t++)(S.pool[i]||[]).filter(d=>d.t===t).sort((a,b)=>b.o-a.o).slice(0,2).forEach(d=>{rows[d.n]={n:d.n,t,o:d.o,pts:0,w:0}});
    sh.T[i]={r:0,rows,car:Tt.teams.map((_,t)=>carNext(i,t,regOf(S.year,i)))};
  });
  S.sh=sh;
}
function shSim(upTo){
  ensureSh();
  [0,1,2,3].forEach(i=>{
    const x=S.sh.T[i];if(!x)return;
    const len=(S.cals&&S.cals[i]?S.cals[i].length:TIERS[i].cal.length);
    const tg=upTo==null?len:Math.min(len,Math.round(S.round/S.total*len));
    const tab=(S.rl&&S.rl.p12)?[25,18,15,12,10,8,6,5,4,3,2,1]:PTS;
    while(x.r<tg){
      x.r++;
      const E=Object.values(x.rows).map(d=>({d,dnf:rnd()<.07,p:.55*d.o+.45*x.car[d.t]+gauss()*4.6}));
      const fin=E.filter(e=>!e.dnf).sort((a,b)=>b.p-a.p);
      fin.forEach((e,k)=>{if(k<tab.length)e.d.pts+=tab[k];if(k===0)e.d.w++});
      if(i===3)ktSh(E,fin,tab);
    }
  });
}

function standView(){
  if(!S.teams||S.first)return '<p class="empty">La classifica compare appena inizia la stagione.</p>';
  const k=S.sk!=null?S.sk:S.tier,sub=S.ss||0,cur=k===S.tier;

  else st=shRows(k);
  const tp={};st.forEach(x=>{tp[x.t]=(tp[x.t]||0)+x.pts});
  const tr=Object.entries(tp).sort((a,b)=>b[1]-a[1]);
  const len=cur?S.total:(S.cals&&S.cals[k]?S.cals[k].length:TIERS[k].cal.length),dn=cur?S.round:(S.sh&&S.sh.T[k]?S.sh.T[k].r:0);
  const ra=cur?ruleActive():[];
  const menu=`<div class="btns">${[3,2,1,0].map(i=>`<button class="ghost${i===k?' on':''}" data-act="sk" data-i="${i}">${TIERS[i].k}</button>`).join('')}</div><div class="btns">${['Piloti','Costruttori'].map((x,i)=>`<button class="ghost${i===sub?' on':''}" data-act="ss" data-i="${i}">${x}</button>`).join('')}</div>`;
  let body;
  if(sub===0)body=`<section class="card"><div class="sech">Piloti · ${TIERS[k].k} ${S.year}</div><p class="sub" style="margin:4px 0 8px">${dn} di ${len} weekend${cur?'':' · classifica simulata'}</p>${tower(st,'season',true)}${ra.length?`<p class="sub" style="margin-top:8px">Norme in vigore: ${ra.map(esc).join(' · ')}</p>`:''}</section>`;
  else body=`<section class="card"><div class="sech">Costruttori · ${TIERS[k].k} ${S.year}</div><p class="sub" style="margin:4px 0 8px">${dn} di ${len} weekend${cur?'':' · classifica simulata'}</p><div class="tw">${tr.map((e,i)=>`<div class="row${cur&&+e[0]===S.teamRank?' me':''}"><span class="n">${i+1}</span><span class="sq" style="--c:${hue(k,+e[0])}"></span><span class="nm">${esc(TIERS[k].teams[+e[0]])}</span><span class="pt">${i&&tr[0][1]>e[1]?`<small class="gp">−${tr[0][1]-e[1]}</small>`:''}${e[1]}</span></div>`).join('')}</div></section>`;

  const INFO={win:['Vincente','Vettura competitiva. Se vinci arrivi con esperienza e pedigree, altrimenti rischi di restare senza sbocchi.'],bal:['Equilibrato','Risultati e sviluppo in egual misura.'],dev:['Sviluppo','Vettura debole, ma ti fanno crescere: arrivi più forte anche senza vincere.']};
  S.offers.forEach((o,i)=>{
    const T=TIERS[o.tier],k=offerKind(o),car=Math.round(carBase(o.tier,o.rank));

    <span class="ofi"><span class="kd ${k}">${inf[0]}</span>${inf[1]}</span>
    ${f?'':`<span class="tags"><span class="tg">${o.note}</span>${cur?'<span class="tg">La tua squadra</span>':''}</span>`}</button>`;
  });
  h+='</div>';
  if(!f)h+='<div class="btns"><button class="ghost" data-act="retire">Ritirati dalle corse</button></div>';

function decideView(){
  const p=S.phase,T=TIERS[S.tier];
  if(p==='offers')return offersView();
  const goal=Math.min(2*S.teams.length-1,2+S.teamRank*2);
  let h=(p==='result'||p==='neg'||p==='negres')?'':`<div class="kick">${T.k} · ${S.year} · ${esc(S.teamName)} · obiettivo: primi ${goal}</div>${stripView()}<p class="sub">Ruolo: ${['alla pari col compagno','Pilota 1','Pilota 2'][stS()]}${S.reg?' · ⚙️ '+esc(S.reg):''}</p>`;

  const stp=S.steps[S.step];
  const num=`Scelta ${Math.min(S.step+1,S.steps.length)} di ${S.steps.length}`;
  if(p==='batch'){
    const b=S.batch;
    h+=`<div class="ph"><div class="kick">Gare simulate</div><h1>Weekend ${b[0].n}${b.length>1?'–'+b[b.length-1].n:''}</h1><p>Il campionato va avanti con le tue statistiche e gli effetti attivi.</p></div>${b[b.length-1].rows?`<section class="card"><div class="sech">Classifica · ${esc(b[b.length-1].c)}</div>${tower(b[b.length-1].rows,'race',true)}</section>`:''}${b[b.length-1].champ?`<section class="card"><div class="sech">Classifica campionato</div>${tower(b[b.length-1].champ,'season',true)}</section>`:''}
    <section class="card"><div class="tw">${b.map(x=>`<div class="row"><span class="n">${x.n}</span><span class="sq" style="--c:var(--neutral)"></span><span class="nm">${esc(x.c)}</span><span class="pt">${x.races.map(r=>r.dnf?'rit.':'P'+r.pos).join(' · ')}</span></div>`).join('')}</div></section>
    <div class="dock"><button class="go" data-act="next">Continua →</button></div>`;
  }else if(p==='event'){
    const e=evOf();
    h+=`<div class="ph"><div class="kick">${stp&&stp.at===0?'Pre-stagione':'Dopo il weekend '+(stp?stp.at:S.round)}</div><h1>${e.t}</h1><p>${e.x}</p>${e.dev?`<p class="sub">${devRole()}</p>`:''}</div>${e.dev?devCtxCard():''}
    <div class="opts">${e.o.map((o,i)=>`<button class="ch" data-act="ev" data-i="${i}"><span class="lt">${LT[i]}</span><span class="cb"><span class="ot">${o.t}</span><span class="od">${o.d}</span>${o.p!=null?devTags(o):''}${o.ch!=null?'<span class="tags"><span class="tg r1">Esito incerto</span></span>':''}</span></button>`).join('')}</div>
    ${simOpt()}`;
  }else if(p==='moment'){
    const mm=MOMS.find(x=>x.id===S.mom);
    h+=`<div class="ph"><div class="kick">Momento chiave · Weekend ${S.round+1}</div><h1>${mm.t}</h1><p>${mm.x}</p></div>${wkLine()}
    <div class="opts">${mm.o.map((o,i)=>{const rk=o.risk>=.04?2:o.risk>=.02?1:0;return `<button class="ch" data-act="mom" data-i="${i}"><span class="lt">${LT[i]}</span><span class="cb"><span class="ot">${o.t}</span><span class="od">${o.d}</span><span class="tags"><span class="tg r${rk}">Rischio ${['basso','medio','alto'][rk]}</span></span></span></button>`}).join('')}</div>`;
  }else if(p==='evres'){
    h+=`<section class="card"><div class="sech">${S.ev.imp?'Imprevisto':'Esito'}</div><p>${S.ev.out}</p>${chips(S.ev.fx)}${S.ev.sm?`<p class="sub">Effetto in corso: ${S.ev.sm.mod>0?'+':''}${S.ev.sm.mod} al passo per ${S.ev.sm.left} weekend.</p>`:''}</section>
    <div class="dock"><button class="go" data-act="next">Continua →</button></div>`;
  }else if(p==='quali'){
    h+=qualiView();
  }else if(p==='qlive'){
    h+=qlView();
  }else if(p==='fp'){
    h+=fpView();
  }else if(p==='act'){
    h+=actView();
  }else if(p==='neg'){

  }else if(p==='negres'){

  }else if(p==='orders'){

    <div class="opts">${r.o.map((o,i)=>{
      const rk=o.risk>=.04?2:o.risk>=.02?1:0;

}

function ktSeas(){if(!S.kt)return;for(const n in S.kt){const k=S.kt[n];k.sw=0;k.sp=0;k.spl=0;k.spt=0}}
function ktRace(order,pole){
  order.forEach(e=>{
    if(e.me)return;
    const k=ktG(e.n);k.r++;
    if(pole&&e.n===pole){k.pl++;k.spl++}
    if(e.dnf){k.cs=0;return}
    if(e.pos===1){k.w++;k.sw++;k.cs++;if(k.cs>k.bw)k.bw=k.cs}else k.cs=0;
    if(e.pos<=3){k.p++;k.sp++}
    if(e.pts>0){k.pf++;k.pt+=e.pts;k.spt+=e.pts}
  });
  const top=order.filter(e=>!e.dnf&&e.pos<=8),W=[5,4,3,3,2,2,1,1];
  if(top.length){
    let tot=0;top.forEach(e=>tot+=W[e.pos-1]);let r=rnd()*tot,pk=top[0];
    for(const e of top){r-=W[e.pos-1];if(r<=0){pk=e;break}}
    if(!pk.me)ktG(pk.n).fl++;
  }
}

function rvGrow(order){
  if(!S.pool||!S.rivals)return;
  const R=Math.max(8,S.total),form={};
  if(order&&order.length){
    const N=order.length;
    const ex=S.rivals.map(r=>({n:r.n,v:.55*r.skill+.45*S.teams[r.t].car}));
    ex.push({n:abbr(S.name),v:.55*rating(S)+.45*(S.teams[S.teamRank].car+S.carBonus)});
    ex.sort((a,b)=>b.v-a.v);
    order.forEach(e=>{if(e.me)return;const rk=ex.findIndex(x=>x.n===e.n)+1;if(!rk)return;form[e.n]=clamp((rk-(e.dnf?N:e.pos))/N,-.5,.5)});
  }
  const cur={};
  S.pool.forEach((P,ti)=>P.forEach(d=>{
    if(d.o0==null)d.o0=d.o;
    const base=tSeas(d,ti)/R;
    const f=ti===S.tier&&form[d.n]!=null?form[d.n]*.3:0;
    d.o=clamp(clamp(d.o+base+f+gauss()*.22,d.o0-4,d.o0+4),40,99);
    if(ti===S.tier)cur[d.n]=d;
  }));
  S.rivals.forEach(r=>{const d=cur[r.n];if(d)r.skill=d.o});
  if(S.sh)for(const i in S.sh.T){const x=S.sh.T[i];if(!x)continue;for(const n in x.rows){const d=(S.pool[i]||[]).find(y=>y.n===n);if(d)x.rows[n].o=d.o}}

const WXH={keep:'stabile',stop:'in calo',worse:'in peggioramento'};
const wxDnf=()=>S.wk&&S.wk.rd===S.round&&S.wk.rain?(S.wk.wx&&S.wk.wx.ri?.025:.008):0;
const wxSd=()=>S.wk&&S.wk.rd===S.round&&S.wk.rain&&S.wk.wx&&S.wk.wx.ri?1.12:1;
function wxInit(w){
  if(!w.rain)return;
  const heavy=rnd()<(w.rp>=70?.5:w.rp>=45?.35:.22),r=rnd();
  w.wx={ri:w.mixed?0:(heavy?1:0),rt:w.mixed?'stop':(r<.5?'keep':r<.78?'stop':'worse')};
}
function wxUpdate(w){
  if(w.fcDone)return;w.fcDone=1;

const TRB=[0,.15,.3,.45];           /* bonus per livello di "pista amica" */
const TRH=[0,-.2,-.4];              /* malus per livello di "pista ostica" */
function trkDev(me){
  const n=Math.max(2,S.teams.length*2),tc=S.teams.map((t,i)=>({i,c:t.car+(i===S.teamRank?S.carBonus:0)})).sort((a,b)=>b.c-a.c),k=tc.findIndex(x=>x.i===S.teamRank),ex=2*k+1.5;

}
/* livello di "pista amica" da un record (vittorie, podi, pole) */
function trkFr(c){

  /* eccesso di risultati rispetto alla tua media di carriera */
  const cs=S.cs||{};let R=0,W=0,Pd=0,Pl=0;
  for(const k in cs){const x=cs[k];R+=x.r;W+=x.w;Pd+=x.p;Pl+=x.pl}
  const gw=R?W/R:0,gp=R?Pd/R:0,gl=R?Pl/R:0;
  const ex=(c.w-c.r*gw)+.5*((c.p-c.w)-c.r*(gp-gw))+.3*(c.pl-c.r*gl);
  return ex>=3.2?3:ex>=2.2?2:ex>=1.2?1:0;
}
/* livello di "pista ostica" dagli ultimi risultati rispetto alle attese */
function trkHo(c){
  if(!c||!c.rl||c.rl.length<2)return 0;
  if(c.y!=null&&S.year-c.y>3)return 0;
  const a=c.rl.slice(-2),m=(a[0]+a[1])/2,w=Math.min(a[0],a[1]);

}
function trkState(cn,tier){
  const T=tier==null?S.tier:tier,cx=S.cx||{};

  let F=0;
  for(let t=0;t<4;t++){const c=cx[t+'|'+cn];if(!c)continue;const lv=trkFr(c);F+=(t===T?1:.5)*lv}
  let fl=Math.min(3,Math.round(F));
  if(S.teams&&carQ()<.15&&fl>0)fl=Math.max(0,fl-(fl>=3?1:0));
  let hl=trkHo(cur);
  if(fl>=2&&hl>0)hl--;
  const w=S.wk,studied=!!(w&&w.rd===S.round&&w.ts);
  const hb=TRH[hl]*(studied?.4:1);
  return{fl,hl,b:(fl>0?TRB[fl]:0)+(hl>0?hb:0),studied,cur,kind:hl>0?'hostile':fl>0?'friend':null};
}
function trkB(cn){

}

function csTrack(cn,me,pts){

  const upd=c=>{

    if(me.g===1)c.pl++;

  };

  const c=S.cx[k]||(S.cx[k]={t:S.tier,c:cn,r:0,w:0,p:0,pl:0,b:99,d:0,pt:0});
  upd(c);
  /* grafici: punti cumulati della stagione e istogramma dei piazzamenti */
  if(S.spY!==S.year){S.sp=[];S.spY=S.year}
  {const rv=S.riv&&(S.rivals||[]).find(r=>r.n===S.riv.n);
   const ld=Math.max(S.me.pts||0,...(S.rivals||[]).map(r=>r.pts||0));
   S.sp.push({a:S.me.pts||0,b:rv?rv.pts||0:null,l:ld});S.spR=rv?rv.n:(S.spR||null);
   S.pl=S.pl||{};const pt=S.pl[S.tier]||(S.pl[S.tier]={});const kk=me.dnf?'R':me.pos;pt[kk]=(pt[kk]||0)+1}

    if(!(was&&was.kind==='hostile')&&now.hl>0&&S.last)S.last.trk={t:'new',c:cn,hl:now.hl};

/* =====================================================================
   v5 · B · Qualifica a piani: evoluzione della pista, giri dei rivali,
   secondo tentativo vero, "Tutto sul finale" come scommessa
   ===================================================================== */
QL[0].n='Subito, pista libera';
QL[0].d='Esci per primo: poca gente in pista, ma l\'asfalto è ancora sporco. Dopo puoi riprovare.';
QL[1].n='Tutto sul finale';
QL[1].d='Un solo giro all\'ultimo minuto, con la pista al massimo. Niente secondo tentativo: traffico e bandiere rosse possono rovinarlo.';
QL[2].n='Scia col compagno';
QL[2].d='Un giro in scia: rende sulle piste veloci. Dopo puoi riprovare.';
const Q5E=[1.8,3.8,6.2],Q5T=[0,1.1,3.0],Q5W=[0,.9,2.1],Q5SOFT=.8;

const q5mx=(d,s)=>{const z=d/s;return d*q5cdf(z)+s*q5pdf(z)};

const q5ev=(x,tau)=>{const E=Q5E[x.e+1];return x.rain?E*(tau<.5?tau:.5-(tau-.5)*1.6):E*tau};
const q5tr=(x,tau)=>Q5T[x.t+1]*(.25+.75*tau);

  switch(k){

    case 'tow':return q5ev(x,.3)-1.5*q5tr(x,.3)+Q5W[x.s+1]-.4-(mateOf()?0:1.0)+r*.7;
    case 'lim':return q5ev(x,.12)-q5tr(x,.12)+.7+r*1.3;
    case 'late':return q5ev(x,.97)-q5tr(x,.97)+r*.9;
    default:return q5ev(x,.78)-.7*q5tr(x,.78)+.5+r*.8;   /* secondo tentativo */
  }
}
const q5K=x=>[.18,.12,.07][x.o==null?1:x.o];
const q5Tc=x=>(.04+.025*(x.u==null?2:x.u))/q5K(x);
let q5err=x=>clamp(.07+.045*(x.t+1)+(x.rain?.07:0)-(mf()>=70?.03:0),.05,.28);

  const f1=q5ev(x,.28)-.6*q5tr(x,.28),f2=q5ev(x,.8)-.6*q5tr(x,.8),p=.78*(x.red?.4:1);
  return f1+p*q5mx(f2-f1,1.1);
}

  const F=q5field(x);

    return m-F;
  }
  const l1=q5lap(k,x,0),l2=q5lap('r2',x,0),pe=q5err(x),pOk=(1-pe)*(x.red?.45:1);

function qEV(k,w){

  for(const t of q.vt)for(const [rn,pa] of [[true,pr],[false,1-pr]])for(const [rd,pb] of [[true,pRd],[false,1-pRd]])tot+=pa*pb*qFit(k,{e:q.e,t,s:q.s,rain:rn,red:rd,u:w.u,o:w.ovt})/q.vt.length;

}

}
const q5X=w=>({e:w.q.e,t:w.q.t,s:w.q.s,rain:w.q.rain,red:w.q.red,u:w.u,o:w.ovt});

function q5Draw(w,R,G){

function q5Grid(E,ref,g0){

/* ---- primo tentativo ---- */
function chooseQuali(i,auto){
  const w=S.wk,q=w.q,lim=(i===3),k=lim?'lim':QL[i].k,fr=lim?.6:qReal(k,w),fe=lim?.58:qEV(k,w),bk=qBest(w),loss=bk[1]-fe;let vd=verdictOf(loss);
  const x=q5X(w),elim=isEl(w);
  if(lim)w.limSel=1;
  if(elim&&!w.eq){w.eq={k:'soft'};w.tyb=-.2}
  const ty=elim?null:(w.qt||'soft');
  if(ty){w.tyb=(w.tyb||0)+(ty==='soft'?-(.08+.04*(w.u||0)):.05)}
  const tb=mf()>=70?.3:mf()<=30?-.3:0;
  w.qx=tb+ckB(w.c)*.5+trkB(w.c)*.5+(w.fpq||0)+(ty==='soft'?Q5SOFT:0);
  w.pen0=S.pen||0;
  const base=qBase().map(e=>({n:e.n,t:e.t,me:!!e.me,q:e.p*.9+gauss()*3.8}));
  w.qE=base;
  const g0=base.slice().sort((a,b)=>b.q-a.q).findIndex(r=>r.me)+1;
  w.qR=q5Draw(w);
  const late=(k==='late');
  w.l1=late?(q.red?q5lap('early',x,gauss())-1.0:q5lap('late',x,gauss())):q5lap(k,x,gauss());
  w.g00=g0;w.gpx=1;w.rd=S.round;w.a2=0;w.qk=k;
  w.qs={k,vd,qv:0,g:0,g0:0,best:bk[0],auto:auto?1:0,el:(w.eq&&w.eq.out)?1:0,rain:q.rain,red:q.red,t:q.t,e:q.e,s:q.s,ty};
  wxUpdate(w);qTail(w);
  if(late){
    q5Final(w,'late');
    if(lim)vd=0;
    if(!auto)S.mf=clamp(mf()+[1,0,0,-1][vd],0,100);
    w.qs.vd=vd;
    w.ql=auto?null:{t:'std',fin:1,how:'late'};
    S.phase=auto?'strat':'qlive';return;
  }
  const G=q5Grid(q5Rows(w,q5Me(w)+w.l1,'prov'),null,g0);
  S.pen=0;
  w.qRef=G.ref;w.grid=G.rows;w.gp=G.g;w.pn=G.pn||0;w.g1=G.g;
  const net=w.l1+w.qx;
  w.qs.g=G.g;w.qs.g0=G.g0;w.qs.qv=Math.round(net*10)/10;
  w.qc=clamp((g0-(G.g-(G.pn||0)))*q5K({o:w.ovt}),-.9,.9);
  if(lim)vd=net>=1.2?0:net>=.4?1:net>=-.4?2:3;
  w.qs.vd=vd;
  if(!auto)S.mf=clamp(mf()+[1,0,0,-1][vd],0,100);
  if(auto){
    const E=qEst(w),p=.02+.46*mf()/100,good=E.gain*q5K({o:w.ovt})>(.04+.025*(w.u||0))&&E.pGain>.4;
    q5Final(w,(rnd()<p?good:rnd()<.5)?'retry':'keep');
    w.ql=null;S.phase='strat';return;
  }
  w.ql={t:'std',st:0};
  S.phase='qlive';
}
/* ---- tentativo finale (tenere / riprovare / giro unico) ---- */
function q5Final(w,how){
  const q=w.q,x=q5X(w),I=q2Info(w);
  const prev={};if(w.grid)w.grid.forEach(r=>{prev[r.n]=r.g});
  const g1=w.g1||0;
  let my=q5Me(w)+w.l1,a2=null,gKeep=null;
  S.pen=w.pen0||0;
  if(how==='retry'){
    const err=rnd()<I.err,redHit=!err&&q.red&&rnd()<.55;
    const l2=q5lap('r2',x,gauss());
    const my2=q5Me(w)+l2;
    /* cosa sarebbe successo tenendo il tempo (per il confronto) */
    const GK=q5Grid(q5Rows(w,my,'fin'),w.qRef,w.g00);S.pen=w.pen0||0;gKeep=GK.g;
    let lost=err||redHit,dmg=false;
    if(!lost&&my2>my)my=my2;
    if(err&&rnd()<.3){dmg=true;w.fpr=(w.fpr||0)-.2;w.qdmg=1}
    w.tyb=(w.tyb||0)-(.04+.025*(w.u||0));w.a2=1;
    a2={err:err?1:0,red:redHit?1:0,dmg:dmg?1:0,l2:Math.round((my2-q5Me(w)-w.l1)*10)/10};
  }else if(how==='keep'){
    w.a2=0;
  }
  const G=q5Grid(q5Rows(w,my,'fin'),w.qRef,w.g00);
  w.grid=G.rows;w.gp=G.g;w.pn=G.pn||0;
  const F=w.qE.filter(r=>!r.me).reduce((a,r)=>a+w.qR[r.n].b,0)/Math.max(1,w.qE.length-1);
  const net=my-w.qE.find(r=>r.me).q-F;
  w.qc=clamp((w.g00-(G.g-(G.pn||0)))*q5K({o:w.ovt}),-.9,.9);
  w.qs.g=G.g;w.qs.g0=G.g0;w.qs.qv=Math.round(net*10)/10;
  if(how==='late'){w.qs.a2=null;w.qs.kp=null;w.qs.sg=1}
  else if(how==='keep'){
    const by=w.grid.filter(r=>!r.me&&prev[r.n]!=null&&prev[r.n]>g1&&r.g<G.g).map(r=>r.n);
    w.qs.kp={d:G.g-g1,by:by.slice(0,3),n:by.length};
  }else{
    w.qs.a2={...a2,g1,d:g1-G.g,dk:gKeep!=null?gKeep-G.g:0,gk:gKeep};
  }
  w.ql={t:'std',fin:1,how,prev};
}
function qSecond(){
  const w=S.wk;
  if(w.a2||!w.qE)return;
  if(!w.qR){qSecondOld();return}
  q5Final(w,'retry');
}
function qOk(){
  const w=S.wk;
  if(w.ql&&w.ql.fin||!w.qR){w.ql=null;S.phase='strat';return}
  q5Final(w,'keep');
}
/* stima per il giocatore: media di molte uscite possibili, con numeri casuali separati */
function qEst(w){
  const I=q2Info(w),R0=mul32(hsh(w.c+'|qe|'+S.year+'|'+S.round+'|'+(w.gp||0))),R=()=>R0();
  const G=()=>{let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*v)};
  const rows=w.qE.filter(r=>!r.me),me=w.qE.find(r=>r.me),m1=me.q+w.qx+w.l1;
  const pr=w.rp/100*.7+(1-w.rp/100)*.12,pRd=Q5RD[w.sck==null?1:w.sck];
  const M=140;let kl=0,k1=0,gn=0,pg=0,pw=0;
  for(let m=0;m<M;m++){
    const x={e:w.q.e,t:w.q.t,s:w.q.s,rain:R()<pr,red:R()<pRd,u:w.u,o:w.ovt};
    const imps=rows.map(r=>{const t1=.1+.35*R(),l1=q5ev(x,t1)-.6*q5tr(x,t1)+G()*.6;let l2=null;if(R()<.78*(x.red?.4:1)){const t2=.6+.37*R();l2=q5ev(x,t2)-q5tr(x,t2)*(R()*1.2)+G()*.8}return{a:l1,b:l2==null?l1:Math.max(l1,l2)}});
    const posOf=my=>1+rows.reduce((a,r,i)=>a+((r.q+imps[i].b)>my?1:0),0);
    const p0=1+rows.reduce((a,r,i)=>a+((r.q+imps[i].a)>m1?1:0),0);
    const pk=posOf(m1);
    const err=R()<q5err(x),red=x.red&&R()<.55,l2=q5lap('r2',x,G()),m2=me.q+w.qx+l2;
    const pr2=(err||red)?pk:posOf(Math.max(m1,m2));
    kl+=pk-p0;if(pk>p0)k1++;gn+=pk-pr2;if(pr2<pk)pg++;if(err)pw++;
  }
  return{keepLoss:kl/M,pLose:k1/M,gain:gn/M,pGain:pg/M,pErr:pw/M};
}
/* ---- vecchio secondo tentativo (salvataggi in corso) ---- */
function qSecondOld(){
  const w=S.wk,q=w.q,I=q2Info(w);
  if(w.a2||!w.qE)return;
  const prev={};w.grid.forEach(r=>{prev[r.n]=r.g});const g1=w.gp;
  const err=rnd()<I.err;
  const imp=err?0:Math.max(0,I.evo*.4+gauss()*.7-I.tp);
  const qv2=w.qv1+imp;
  const E=w.qE.map(x=>x.me?x:{...x,q:x.q+(rnd()<.6?Math.max(0,I.evo*.3+gauss()*.7):0)});
  S.pen=w.pen0||0;
  const G=makeGrid(qv2,E,w.qRef);
  w.grid=G.rows;w.gp=G.g;w.pn=G.pn||0;w.qc=qv2*QCARRY;w.tyb=(w.tyb||0)-.2;w.a2=1;
  w.qs.g=G.g;w.qs.a2={err:err?1:0,g1,d:g1-G.g};
  qTail(w);
  w.ql={t:'std',a2:1,prev};
}
function qWhy(s){
  if(s.k==='lim')return s.vd<=1?'Il giro al limite è riuscito: griglia migliore del previsto.':'Il giro al limite non è riuscito: qualche decimo è rimasto in pista.';
  if(s.rain)return s.k==='early'?'Pioggia in arrivo: scendere subito ha pagato.':s.k==='late'?'Pioggia: aspettare è costato il giro migliore.':'Pioggia sul finale: la scia non è bastata.';
  if(s.red&&s.k==='late')return 'Bandiera rossa nel finale: il giro è saltato.';
  if(s.red)return 'Bandiera rossa nel finale: chi aveva già un tempo ne ha approfittato.';
  if(s.k==='early')return s.t===1?'Traffico alto: partire subito ti ha dato pista libera.':s.e===1?'Pista in forte evoluzione: il primo giro era su asfalto ancora sporco.':'Giro pulito, ma con la pista ancora sporca.';
  if(s.k==='late')return s.e===1?'Pista in forte evoluzione: aspettare ha pagato.':s.t===1?'Troppo traffico nel finale: giro rovinato.':'Hai aspettato il momento giusto.';
  return s.s===1?'Rettilinei lunghi: la scia ha dato decimi preziosi.':s.s===-1?'Rettilinei corti: la scia è servita a poco.':'La scia ha aiutato, senza fare la differenza.';
}
function qsLine(s){
  if(s.el)return elimLine(s);
  const vd=QVD[s.vd],p=QL.find(x=>x.k===s.k)||QLIM,dg=s.g0-s.g;
  const ex=s.a2?(s.a2.err?' · secondo tentativo sbagliato':s.a2.red?' · bandiera rossa al secondo tentativo':s.a2.d>0?' · secondo tentativo riuscito':' · secondo tentativo senza guadagni'):s.kp?' · tempo tenuto':'';
  const ty=s.ty?` <small>(${s.ty==='soft'?'morbide':'medie'})</small>`:'';
  return `<div class="qsl"><div><b style="color:${vd[1]}">${vd[0]}</b> · ${p.n}${ty}${ex}${s.auto?' <small>(scelta del muretto)</small>':''}</div><div>${qWhy(s)}${dg?` <b>${dg>0?'+':''}${dg} posizioni</b> rispetto alla pura velocità della vettura.`:''}</div></div>`;
}
function autoQ(){
  const w=S.wk,bk=qBest(w)[0],p=.02+.46*mf()/100;

const nCdf=z=>{const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2),p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p};
/* piazzamento atteso della macchina (1 = prima), in base alla posizione del team */
function exF(){
  const tc=S.teams.map((t,i)=>({i,c:t.car+(i===S.teamRank?S.carBonus:0)})).sort((a,b)=>b.c-a.c),k=tc.findIndex(x=>x.i===S.teamRank);
  return clamp(2*k+1.5-(S.dvA||0)*S.teams.length*2,1,S.teams.length*2);

  const N=mkN(),ex=exF();

}

function obP(o,w){
  const N=mkN(),ef=obEf(w),dn=.09,g=w&&w.gpx?w.gp:Math.round(ef),ex=exF();

    case 'top':return lt(o.n);
    case 'pod':return lt(3);
    case 'win':return lt(1);

/* piani disponibili per categoria: F4 4, F3 5, F2 6, F1 7 */
const PLK=[['one','soft','inter','safe'],['one','two','soft','inter','safe'],['one','two','soft','under','inter','safe'],['one','two','soft','under','over','inter','safe']];

    if(p.k==='one')return{...p,n:'Gara di gestione',c:['M'],d:'Gomma unica: passo costante e pazienza, aspetta gli errori degli altri.'};
    if(p.k==='soft')return{...p,n:'Attacco dal via',c:['M'],d:'Parti a tutta e guadagna posizioni subito: l\'usura si paga nel finale.'};
    if(p.k==='inter')return{...p,n:'Scommessa pioggia',c:['W'],d:'Assetto e gomma da bagnato dal via: tutto sulla pioggia.'};
    if(p.k==='safe')return{...p,c:['M'],d:'Segui l\'approccio dei team davanti a te.'};

/* effetto della finestra di sosta */
function winRaw(win,u,o,s){
  const e=win==='early'?1:win==='late'?-1:0;

  return e*(.05*d+.035*ov-.08*(s-.35))-.012;
}
function winReal(win,k,w){
  if(!win||w.rain)return 0;
  return winRaw(win,w.u,w.ovt,w.sc?1:0);
}
function winEV(win,k,w){
  if(!win)return 0;
  const d=S.diff==null?1:S.diff,kn=w.kn;
  const W=kn.wear?[w.wear]:w.vw,O=kn.ovt?[w.ovt]:d===2?[0,1,2]:w.vo,SS=kn.sc?[w.sck]:d===2?[0,1,2]:w.vs;
  const s=SS.reduce((a,i)=>a+SCP[i],0)/SS.length,dry=kn.rain?(w.rain?0:1):1-w.rp/100;
  let t=0;
  for(const wr of W)for(const ov of O)t+=winRaw(win,clamp(wr+1+w.ta,0,4),ov,s)/(W.length*O.length);
  return t*dry;
}
const WINS=['early','std','late'];
function bpX(w,real){
  let best=null;

    const base=real?fitReal(k,w):fitEV(k,w);
    const ws=(winAvail()&&winPlan(k))?WINS:[null];
    for(const win of ws){
      const v=base+(win?(real?winReal:winEV)(win,k,w):0);
      if(!best||v>best[1])best=[k,v,win||'std'];
    }

/* consiglio testuale sulla finestra, basato sui dati che il giocatore possiede */

  if(kn.wear)out.push(w.u>=3?'Usura alta: sostare presto protegge le gomme.':w.u<=1?'Usura bassa: puoi allungare il primo stint.':'Usura media: finestra standard senza rischi.');

  if(kn.ovt)out.push(w.ovt===0?'Sorpassi difficili: l\'aria pulita dopo la sosta vale molto.':w.ovt===2?'Sorpassi facili: puoi permetterti di rientrare tardi.':'');

  S.sw={i,k:p.k,fit:fr,fe,best:bk[0],bestFit:bk[1],hind:br[0],hindFit:br[1],vd,v:Math.round(v*10)/10,risk:rk,loss,luck:fr-fe,kn:{...w.kn}};

function autoPlan(){
  const w=AUTOW=mkWk(),b=bpX(w,false),p=.02+.46*mf()/100,keys=planKeys();
  const k=rnd()<p?b[0]:keys[Math.floor(rnd()*keys.length)],i=PL.findIndex(x=>x.k===k),pl=PL[i];
  const win=(winAvail()&&winPlan(k))?(rnd()<p?b[2]:'std'):null;

  let r=w;
  for(let i=1;i<o.length;i++){
    const k=o[i];let e;
    if(d.has(k))e=d.get(k);else if(k===n)e=w+w[0];else throw new Error('bad');
    r+=e;
    if(n<65535){d.set(n++,w+e[0])}

  }

const u8bin=s=>{const b=new TextEncoder().encode(s);let r='';for(let i=0;i<b.length;i++)r+=String.fromCharCode(b[i]);return r};
const binu8=s=>{const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return new TextDecoder().decode(b)};
function bkEnc(obj){
  const codes=lzwE(u8bin(JSON.stringify(obj)));
  let bin='';for(const c of codes)bin+=String.fromCharCode(c>>8,c&255);
  const b64=btoa(bin);
  return 'GDP1.'+b64+'.'+hsh(b64).toString(16);
}
function bkDec(txt){
  const t=String(txt||'').replace(/\s+/g,'');
  const m=/^GDP1\.([A-Za-z0-9+/=]+)\.([0-9a-f]+)$/.exec(t);
  if(!m)throw new Error('Formato non riconosciuto');
  if(hsh(m[1]).toString(16)!==m[2])throw new Error('Codice incompleto o modificato');
  const bin=atob(m[1]);const o=[];
  for(let i=0;i+1<bin.length;i+=2)o.push(bin.charCodeAt(i)<<8|bin.charCodeAt(i+1));
  const j=JSON.parse(binu8(lzwD(o)));
  if(!j||typeof j!=='object'||!j.name||j.tier==null||j.year==null)throw new Error('Non è un salvataggio valido');
  return j;
}

const b64u8=u=>{let r='';for(let i=0;i<u.length;i++)r+=String.fromCharCode(u[i]);return btoa(r)};
const u8b64=b=>{const r=atob(b),u=new Uint8Array(r.length);for(let i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u};
async function pipeAll(u8,Cls,fmt){
  const st=new Blob([u8]).stream().pipeThrough(new Cls(fmt));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
async function bkEncA(obj){
  if(typeof CompressionStream==='undefined')return bkEnc(obj);
  try{
    const z=await pipeAll(new TextEncoder().encode(JSON.stringify(obj)),CompressionStream,'deflate-raw');
    const b=b64u8(z);
    return 'GDP2.'+b+'.'+hsh(b).toString(16);
  }catch(e){return bkEnc(obj)}
}
async function bkDecA(txt){
  const t=String(txt||'').replace(/\s+/g,'');
  const m=/^GDP2\.([A-Za-z0-9+/=]+)\.([0-9a-f]+)$/.exec(t);
  if(!m)return bkDec(t);
  if(hsh(m[1]).toString(16)!==m[2])throw new Error('Codice incompleto o modificato');
  if(typeof DecompressionStream==='undefined')throw new Error('Questo browser non sa leggere il codice: aggiornalo');
  const u=await pipeAll(u8b64(m[1]),DecompressionStream,'deflate-raw');
  const j=JSON.parse(new TextDecoder().decode(u));
  if(!j||typeof j!=='object'||!j.name||j.tier==null||j.year==null)throw new Error('Non è un salvataggio valido');
  return j;
}

const HCOL=['#ffd23a','#e10600','#ff7a00','#0d1b3d','#1f6feb','#22c1a6','#1fa34a','#8b5cf6','#ff4fa3','#ffffff','#111111','#9aa3b2'];
const HPN=['Tinta unita','Fascia','Diagonale','Doppia fascia','Freccia','Scacchi','Pois'];
const HSHELL='M6 40C6 19 21 6 38 6C53 6 62 17 62 32L62 45C62 51 58 56 52 56L20 56C12 56 6 50 6 40Z';
const HVISOR='M37 27L62 27L62 42L42 42C37 42 34 37 37 27Z';
/* forme del motivo nello spazio 64x64: r=rect, p=path, c=cerchio */
function hPat(p){
  switch(p){
    case 1:return [['r',0,20,64,9]];
    case 2:return [['p','M0 0H64V22L0 38Z']];
    case 3:return [['r',0,15,64,5],['r',0,25,64,5]];
    case 4:return [['p','M8 56L30 12L40 12L62 56L52 56L35 24L18 56Z']];
    case 5:{const a=[];for(let i=0;i<8;i++)for(let j=0;j<3;j++)if((i+j)%2===0)a.push(['r',i*8,12+j*8,8,8]);return a}
    case 6:{const a=[];for(let i=0;i<5;i++)for(let j=0;j<3;j++)a.push(['c',9+i*11+(j%2?5:0),16+j*10,3]);return a}
  }
  return [];
}
let HID=0;
function helmetSvg(h,sz,cls){
  h=h||{a:'#ffd23a',b:'#0d1b3d',p:0};
  const id='hm'+(HID++),pat=hPat(h.p).map(s=>s[0]==='r'?`<rect x="${s[1]}" y="${s[2]}" width="${s[3]}" height="${s[4]}"/>`:s[0]==='p'?`<path d="${s[1]}"/>`:`<circle cx="${s[1]}" cy="${s[2]}" r="${s[3]}"/>`).join('');
  return `<svg class="hm${cls?' '+cls:''}" viewBox="0 0 64 64" width="${sz}" height="${sz}" aria-hidden="true"><defs><clipPath id="${id}"><path d="${HSHELL}"/></clipPath></defs><path d="${HSHELL}" fill="${h.a}"/><g clip-path="url(#${id})" fill="${h.b}">${pat}</g><path d="${HSHELL}" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="2"/><path d="${HVISOR}" fill="#0b1224"/><path d="M40 30L58 30L58 33L39 33Z" fill="rgba(255,255,255,.35)"/></svg>`;
}
/* canvas: stessa geometria */
function helmetCanvas(g,x,y,s,h){
  h=h||{a:'#ffd23a',b:'#0d1b3d',p:0};
  g.save();g.translate(x,y);g.scale(s/64,s/64);
  const sh=new Path2D(HSHELL);
  g.fillStyle=h.a;g.fill(sh);
  g.save();g.clip(sh);g.fillStyle=h.b;
  hPat(h.p).forEach(q=>{
    if(q[0]==='r')g.fillRect(q[1],q[2],q[3],q[4]);
    else if(q[0]==='p')g.fill(new Path2D(q[1]));
    else{g.beginPath();g.arc(q[1],q[2],q[3],0,7);g.fill()}
  });
  g.restore();
  g.lineWidth=2;g.strokeStyle='rgba(0,0,0,.35)';g.stroke(sh);
  g.fillStyle='#0b1224';g.fill(new Path2D(HVISOR));
  g.fillStyle='rgba(255,255,255,.35)';g.fill(new Path2D('M40 30L58 30L58 33L39 33Z'));
  g.restore();
}
const randHelm=()=>{const a=Math.floor(Math.random()*HCOL.length);let b=Math.floor(Math.random()*HCOL.length);if(b===a)b=(b+4)%HCOL.length;return{a:HCOL[a],b:HCOL[b],p:1+Math.floor(Math.random()*(HPN.length-1))}};

const TCOL=['#22c1a6','#1f6feb','#ff7a00','#e10600'];
const CHW=320,CHH=150,CHP={l:30,r:10,t:10,b:22};
function chFrame(inner,xl,yt){
  return `<svg class="chs" viewBox="0 0 ${CHW} ${CHH}" role="img" aria-label="grafico">${inner}</svg>`;
}
/* griglia orizzontale con etichette sull'asse Y */
function chGrid(y0,y1,n,fmtv){
  const h=CHH-CHP.t-CHP.b;let g='';
  for(let i=0;i<=n;i++){
    const v=y0+(y1-y0)*i/n,y=CHP.t+h-(h*i/n);
    g+=`<line x1="${CHP.l}" x2="${CHW-CHP.r}" y1="${y}" y2="${y}" class="chg"/><text x="${CHP.l-4}" y="${y+3}" text-anchor="end" class="cht">${fmtv?fmtv(v):Math.round(v)}</text>`;
  }
  return g;
}
const chX=(i,n)=>CHP.l+(n<=1?0:(CHW-CHP.l-CHP.r)*i/(n-1));
const chY=(v,y0,y1)=>CHP.t+(CHH-CHP.t-CHP.b)*(1-(v-y0)/Math.max(1e-6,(y1-y0)));
const chPath=(a,y0,y1,n,off)=>a.map((v,i)=>(i?'L':'M')+chX(i+(off||0),n).toFixed(1)+' '+chY(v,y0,y1).toFixed(1)).join('');
/* 1 · punti nella stagione contro il rivale */
function chSeason(){
  const sp=S.sp;
  if(!sp||sp.length<2||S.spY!==S.year)return '';
  const n=S.total||sp.length,max=Math.max(10,...sp.map(x=>Math.max(x.a,x.b||0,x.l||0)));
  const y1=Math.ceil(max/20)*20;
  const A=sp.map(x=>x.a),B=sp.map(x=>x.b),Lc=sp.map(x=>x.l);
  const nm=S.spR||'Rivale';
  let g=chGrid(0,y1,4);
  for(let i=0;i<n;i+=Math.max(1,Math.round(n/6)))g+=`<text x="${chX(i,n)}" y="${CHH-6}" text-anchor="middle" class="cht">${i+1}</text>`;
  if(Lc.some(v=>v>0))g+=`<path d="${chPath(Lc,0,y1,n)}" class="chl lead"/>`;
  if(B.some(v=>v!=null))g+=`<path d="${chPath(B.map(v=>v||0),0,y1,n)}" class="chl riv"/>`;
  g+=`<path d="${chPath(A,0,y1,n)}" class="chl me"/>`;
  const lx=chX(A.length-1,n),ly=chY(A[A.length-1],0,y1);

}
/* 2 · valutazione negli anni */
function chRating(){
  const H=S.hist||[];
  const pts=H.map(h=>({y:h.y,v:h.ovr,t:h.tier}));
  pts.push({y:S.year,v:Math.round(rating(S)),t:S.tier,cur:1});
  if(pts.length<2)return '';
  const vs=pts.map(p=>p.v),lo=Math.floor((Math.min(...vs)-4)/10)*10,hi=Math.ceil((Math.max(...vs)+4)/10)*10;
  const n=pts.length;
  let g=chGrid(lo,hi,4);
  const step=Math.max(1,Math.round(n/6));
  pts.forEach((p,i)=>{if(i%step===0||i===n-1)g+=`<text x="${chX(i,n)}" y="${CHH-6}" text-anchor="middle" class="cht">${String(p.y).slice(2)}</text>`});
  g+=`<path d="${chPath(vs,lo,hi,n)}" class="chl me"/>`;
  pts.forEach((p,i)=>{g+=`<circle cx="${chX(i,n)}" cy="${chY(p.v,lo,hi)}" r="${p.cur?4:3}" fill="${TCOL[p.t]}" class="chd${p.cur?' cur':''}"><title>${p.y} · ${TIERS[p.t].k} · ${p.v}</title></circle>`});
  return `<div class="chb"><div class="chh"><b>Valutazione negli anni</b><span class="chk">${[0,1,2,3].filter(t=>pts.some(p=>p.t===t)).map(t=>`<i class="k" style="background:${TCOL[t]}"></i>${TIERS[t].k}`).join('')}</span></div>${chFrame(g)}</div>`;

/* 3 · classifica finale per stagione */
function chFinish(){
  const H=S.hist||[];

    if(n<=12||i%2===0)g+=`<text x="${cx}" y="${CHH-6}" text-anchor="middle" class="cht">${String(x.y).slice(2)}</text>`;
  });

/* 4 · come chiudi le gare */
function chPlace(){
  const pl=S.pl;if(!pl)return '';
  const A={};let tot=0;
  for(const t in pl)for(const k in pl[t]){A[k]=(A[k]||0)+pl[t][k];tot+=pl[t][k]}

/* spline chiusa Catmull-Rom → path cubico */
const rmPos=(w,rc,n)=>n<=0?(w.gp||10):((rc.pe&&rc.pe[n])||(w.gp||10));
const rmLead=n=>.08+.26*n;
let RMK='',RMRAF=0;
function raceMap(){
  const w=S.wk,rc=S.rc;
  if(!w||!rc)return '';
  const N=Math.min(24,(S.rivals?S.rivals.length:19)+1);
  const est=clamp(rmPos(w,rc,rc.n),1,N),prev=clamp(rc.n<=0?est:rmPos(w,rc,rc.n-1),1,N);
  const key=S.year+'|'+S.round+'|'+rc.n;
  const dots=[];
  const slot=(pos,j)=>j<pos?j+1:j+2;      /* j = indice tra gli altri (0-based) */
  for(let j=0;j<N-1;j++){
    const sN=slot(est,j),sP=slot(prev,j);
    const cls=sN===1?'ld':sN===est-1?'ah':sN===est+1?'bh':'';
    dots.push(`<circle class="rd ${cls}" r="${sN===1?1.9:1.5}" data-a="${(rmLead(Math.max(0,rc.n-1))-(sP-1)*.019).toFixed(4)}" data-b="${(rmLead(rc.n)-(sN-1)*.019).toFixed(4)}"/>`);
  }
  const h=helmOf?helmOf():{a:'#ffd23a'};
  dots.push(`<circle class="rd me" r="2.8" style="fill:${h.a}" data-a="${(rmLead(Math.max(0,rc.n-1))-(prev-1)*.019).toFixed(4)}" data-b="${(rmLead(rc.n)-(est-1)*.019).toFixed(4)}"/>`);
  const lights=rc.n===0?`<div class="slt" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>`:'';
  return `<div class="rmc card" data-k="${key}"><div class="rmh"><b>${esc(w.c)}</b><span>Ora sei <b>P${est}</b>${rc.n>0&&est!==prev?` <em class="${est<prev?'up':'down'}">${est<prev?'▲':'▼'} ${Math.abs(prev-est)}</em>`:''}</span></div>${lights}<svg class="rmap" viewBox="0 0 100 60" aria-hidden="true"><path class="rmt0" d="${trkPath(trkPts(w.c))}"/><path class="rmt" d="${trkPath(trkPts(w.c))}"/>${dots.join('')}</svg></div>`;
}
function rmAnim(){
  const el=document.querySelector&&document.querySelector('.rmc');
  if(!el)return;
  const path=el.querySelector('.rmt');if(!path||!path.getTotalLength)return;
  const L=path.getTotalLength(),dots=[...el.querySelectorAll('.rd')];
  const put=(d,p)=>{const q=((p%1)+1)%1,pt=path.getPointAtLength(q*L);d.setAttribute('cx',pt.x.toFixed(2));d.setAttribute('cy',pt.y.toFixed(2))};
  const k=el.dataset.k;
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  cancelAnimationFrame(RMRAF);
  const first=RMK!==k;RMK=k;
  if(!first||reduce||!S.rc||S.rc.n===0){dots.forEach(d=>put(d,+d.dataset.b));return}
  const T=1100,t0=performance.now();
  dots.forEach(d=>put(d,+d.dataset.a));
  const step=t=>{
    let x=Math.min(1,(t-t0)/T);x=x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
    dots.forEach(d=>put(d,+d.dataset.a+(+d.dataset.b-+d.dataset.a)*x));
    if(x<1)RMRAF=requestAnimationFrame(step);
  };
  RMRAF=requestAnimationFrame(step);
}

const PHN=['aero','power','mech'],PHL={aero:'aerodinamica',power:'motore',mech:'telaio e meccanica'},PHB={aero:'Aerodinamica',power:'Motore',mech:'Telaio'};
const regPhil=(y,t)=>PHN[hsh('reg|'+t+'|'+y)%3];
function regRum(y,t){
  const ph=regPhil(y,t),h=hsh('rum|'+t+'|'+y);
  if(h%10<7)return ph;
  return PHN[(PHN.indexOf(ph)+1+((h>>>5)%2))%3];
}
const regU=s=>{const h=hsh(s);return(((h&1023)+((h>>>10)&1023)+((h>>>20)&1023))/1023-1.5)/.5};
const regAff=(n,ph,y,t)=>.95*regU(n+'|'+ph)+.32*regU(n+'|'+ph+'|'+y+'|'+t);
const regMajor=(y,t)=>{const r=regOf(y,t);return r&&r[1]>=4?r:null};
const fx1=v=>(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(1);
/* applicazione a inizio stagione (sostituisce il rumore casuale) */
function regApply(rg){
  const mag=rg[1];
  if(mag<4){S.teams.forEach(x=>x.car+=gauss()*mag);return}
  const ph=regPhil(S.year,S.tier);
  const F=S.regF&&S.regF.y===S.year&&S.regF.k?S.regF.k[S.tier]:null;
  const info={y:S.year,t:S.tier,ph,mag,txt:rg[0],f:F&&F!=='none'?F:null,d:[]};
  S.teams.forEach(x=>{
    const aff=regAff(x.name,ph,S.year,S.tier);
    let d=mag*(.75*aff+.66*gauss());
    const me=x.rank===S.teamRank;
    if(me&&info.f){info.hit=info.f===ph;d+=info.hit?mag*.22:-mag*.07;info.fx=info.hit?mag*.22:-mag*.07}
    x.car+=d;
    info.d.push({n:x.name,d:Math.round(d*10)/10,me,a:Math.round(aff*10)/10});
  });
  const s=info.d.slice().sort((a,b)=>b.d-a.d);
  info.up=s.slice(0,2).map(x=>x.n);info.dn=s.slice(-2).map(x=>x.n).reverse();
  const m=info.d.find(x=>x.me);info.my=m?m.d:0;info.ma=m?m.a:0;
  info.rk=m?s.indexOf(s.find(x=>x.me))+1:0;info.N=s.length;
  info.d=m?[m]:[];
  S.regInfo=info;
  (S.regH=S.regH||[]).push({y:info.y,t:info.t,ph,up:info.up[0],dn:info.dn[0],my:info.my,rk:info.rk,N:info.N,f:info.f,hit:info.hit});
  if(S.regH.length>12)S.regH.shift();
  try{if(S.mkt)S.mkt.unshift(TIERS[S.tier].k+' '+S.year+': nuovo regolamento, vince la filosofia «'+PHL[ph]+'». '+info.up[0]+' parte forte, '+info.dn[0]+' in difficoltà.')}catch(e){}
}

function regPreview(){
  const ty=[S.tier];if(S.tier<3)ty.push(S.tier+1);
  const y=S.year+1;
  const L=ty.map(t=>[t,regMajor(y,t)]).filter(x=>x[1]);
  if(!L.length)return '';
  const cur=S.regF&&S.regF.y===y?S.regF.k:{};
  const blk=L.map(([t,r])=>{
    const rum=regRum(y,t);
    const b=['aero','power','mech','none'].map(k=>`<button class="ghost sm${cur[t]===k?' on':''}" data-act="rgf" data-v="${t}:${k}">${k==='none'?'Resta flessibile':PHB[k]}</button>`).join('');
    return `<div class="rgb"><div class="rgt"><b>${TIERS[t].k} ${y}</b> · ${esc(r[0])}</div>
    <p class="sub" style="margin:2px 0 6px">Voci dal paddock: la filosofia vincente dovrebbe essere <b>${PHL[rum]}</b>. Fonte attendibile, ma non certa: ci prende circa 7 volte su 10.</p>
    <p class="sub" style="margin:0 0 4px">Dove concentri lo sviluppo? Se indovini guadagni molto, se sbagli perdi poco; se resti flessibile non cambia nulla.</p>
    <div class="btns">${b}</div></div>`;
  }).join('');
  return `<section class="card rgc"><div class="sech">${ico('bolt','fl')} Nuovo regolamento in arrivo</div>${blk}</section>`;
}
function regAct(v){

/* i tracciati ufficiali sostituiscono le forme stilizzate */
function trkPts(cn){
  if(TRKD[cn])return TRKD[cn].split(' ').map(s=>s.split(',').map(Number));
  if(TRKP[cn])return TRKP[cn];
  const h=hsh(String(cn)+'m'),n=9,a=[];
  for(let i=0;i<n;i++){const t=i/n*Math.PI*2,r=.68+(((h>>>(i*3))&7)/7)*.32;a.push([50+Math.cos(t)*44*r,30+Math.sin(t)*25*r])}
  return a;
}
function trkPath(pts){
  const n=pts.length;
  if(n>24)return 'M'+pts.map(p=>p[0]+' '+p[1]).join('L')+'Z';
  let d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(let i=0;i<n;i++){
    const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+='C'+c1[0].toFixed(1)+' '+c1[1].toFixed(1)+' '+c2[0].toFixed(1)+' '+c2[1].toFixed(1)+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
  }
  return d+'Z';
}

   ===================================================================== */
let NTO=false,TWO=false;
function wkLayout(){
  const app=document.getElementById('app');
  if(!app||!app.querySelector||!S)return;
  const pane=app.querySelector('.pane');if(!pane)return;
  const pick=pane.querySelector(':scope>.pick');
  if(S.tab!=='decide'&&!pick)return;
  pane.classList.add('dec');
  /* note del weekend: una sola scheda, a righe su desktop e a chip su telefono */
  const notes=[...pane.querySelectorAll(':scope>.rvl.ckl')];
  const inAct=[...pane.querySelectorAll(':scope>.chips.wl')].some(c=>/Atto \d/.test(c.textContent));
  if(inAct&&notes.length===1)notes[0].remove();
  else if(notes.length){
    const nts=document.createElement('div');nts.className='nts card'+(NTO?' open':'');
    const labs=notes.map(n=>{
      const bs=[...n.querySelectorAll('b')].map(b=>b.textContent.trim().replace(/[.:]$/,''));
      let t=bs.join(' · ');if(/Gara principale/.test(t))t='Gara principale';
      return t||n.textContent.trim().slice(0,24);
    });
    nts.innerHTML='<button class="ntb" data-act="nto"><span class="ntt">Note del weekend</span><span class="ntc">'+labs.map(l=>'<span>'+esc(l)+'</span>').join('')+'</span><i></i></button><div class="ntl"></div>';
    const L=nts.querySelector('.ntl');
    pane.insertBefore(nts,notes[0]);
    notes.forEach(n=>{n.classList.add('nti');L.appendChild(n)});
  }
  /* situazione di gara: sempre vicino alle scelte */
  const wl=[...pane.querySelectorAll(':scope>.chips.wl')].find(c=>/Atto \d/.test(c.textContent));
  if(wl)wl.classList.add('sit');
  /* scheda motore con azioni: urgente */
  pane.querySelectorAll(':scope>.card').forEach(c=>{
    const h=c.querySelector('.sech');
    if(h&&/Motore/.test(h.textContent)&&c.querySelector('button[data-act]'))c.classList.add('urg');
  });
  /* telefono: classifica lunga ridotta a primi 3 e dintorni */
  if(!wideDesk()){
    pane.querySelectorAll('.tw').forEach(tw=>{
      const rows=[...tw.querySelectorAll(':scope>.row')];
      if(rows.length<=12)return;
      const me=rows.findIndex(r=>r.classList.contains('me'));
      const cut=rows.findIndex(r=>r.classList.contains('v3el'));
      rows.forEach((r,i)=>{
        const keep=i<3||(me>=0&&Math.abs(i-me)<=2)||(cut>0&&i>=cut-2&&i<=cut+1);
        if(!keep&&!TWO)r.classList.add('twh');
      });
      const b=document.createElement('button');b.className='ghost sm twb';b.dataset.act='two';
      b.textContent=TWO?'Mostra meno':'Mostra tutti ('+rows.length+')';
      tw.appendChild(b);
    });
  }
  /* desktop: scelte a sinistra, contesto a destra */
  if(pick&&wideDesk()){
    pane.classList.add('dsk');
    const L=document.createElement('div'),R=document.createElement('div');L.className='dL';R.className='dR';
    const ctx=pane.querySelector(':scope>.ctx');
    [...pane.children].forEach(c=>{
      if(c===ctx)return;
      const left=c.classList.contains('ph')||c.classList.contains('wnc')||c.classList.contains('sit')||c.classList.contains('urg')||c.classList.contains('rlc')||c===pick;
      (left?L:R).appendChild(c);
    });
    pane.appendChild(L);
    if(R.children.length)pane.appendChild(R);else pane.classList.add('nor');
  }
}

  NZX={m:rc.nz.m*NFR[n],r:{}};
  for(const k in rc.nz.r)NZX.r[k]=rc.nz.r[k]*NFR[n];

  try{E=simulateRace({mod:rc.mod+AB,risk:rc.risk,sk:'ritmo',fx:{},out:''},PTS)}
  finally{PKK=false;NZX=svN;RNG=svR}
  const srt=E.slice().sort((a,b)=>b.perf-a.perf),i=srt.findIndex(e=>e.me);
  rc.pg=rc.pg||{};
  const a=i>0?srt[i-1].perf-srt[i].perf:null,b=i>=0&&i<srt.length-1?srt[i].perf-srt[i+1].perf:null;
