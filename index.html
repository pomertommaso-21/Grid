<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1b3d"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Griglia"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Griglia di Partenza</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: pagina chiara con barra di navigazione in basso. Identità: targa del numero di gara (blu notte con cornice gialla), classifica a torre con la posizione su tassello scuro, schede quadrate con filo del colore della scuderia, scelte contrassegnate A, B, C come i box della griglia. */
:root{
  --bg:#f4f5f7;
  --panel:#ffffff;
  --soft:#eceef2;
  --line:#dfe2e8;
  --fg:#0d1b3d;
  --mut:#5b6478;
  --yellow:#ffd23a;
  --yellow-ink:#0d1b3d;
  --plate:#0d1b3d;
  --plate-fg:#ffffff;
  --btn-bg:#0d1b3d;
  --btn-fg:#ffffff;
  --me:#fff0b8;
  --purple:#7c4dff;
  --green:#12a150;
  --amber:#d99a00;
  --warn:#e5372f;
  --neutral:#b4bcc9;
  --good-bg:#dcf3e3;
  --shadow:0 1px 0 rgba(13,27,61,.04),0 3px 12px rgba(13,27,61,.06);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1020;--panel:#131b30;--soft:#1b2540;--line:#27325a;--fg:#eef1f9;--mut:#9ba6c2;--plate:#2a3a6b;--btn-bg:#ffd23a;--btn-fg:#0d1b3d;--me:#4a3f12;--purple:#a78bfa;--green:#34d399;--amber:#fbbf24;--warn:#f87171;--neutral:#4a5578;--good-bg:#143a2a;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1020;--panel:#131b30;--soft:#1b2540;--line:#27325a;--fg:#eef1f9;--mut:#9ba6c2;--plate:#2a3a6b;--btn-bg:#ffd23a;--btn-fg:#0d1b3d;--me:#4a3f12;--purple:#a78bfa;--green:#34d399;--amber:#fbbf24;--warn:#f87171;--neutral:#4a5578;--good-bg:#143a2a;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--body);padding-block:10px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:800;letter-spacing:-.03em}
p{margin:0}
button{font:inherit;color:inherit}
:is(button,input):focus-visible{outline:3px solid var(--yellow);outline-offset:2px;box-shadow:0 0 0 5px var(--plate)}
.home{display:flex;flex-direction:column;gap:14px;padding-top:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{flex:none;width:48px;height:48px}
.wm{font-size:clamp(26px,8vw,34px);line-height:1}
.tagline{color:var(--mut);font-size:14px;max-width:34ch}
.links{display:flex;flex-direction:column;gap:8px}
.link{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;width:100%;box-shadow:var(--shadow)}
.link:hover{border-color:var(--fg)}
.link .pos{background:var(--yellow);color:var(--yellow-ink);font:800 13px var(--display);padding:6px 8px;border-radius:6px;min-width:38px;text-align:center}
.link b{display:block;font:700 15px var(--display);letter-spacing:-.02em}
.link small{color:var(--mut);font-size:12.5px}
.link i{font-style:normal;font-size:20px;color:var(--mut)}
.foot{color:var(--mut);font-size:12px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;gap:4px;background:var(--panel);border-top:1px solid var(--line);padding:4px max(12px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.nav>*{max-width:140px}

.plate.xs{min-width:40px;height:32px;font-size:18px;outline-offset:-3px;padding:0 6px;border-radius:6px;flex:none}
.hn{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}

.ovr{display:flex;align-items:baseline;gap:6px;background:var(--yellow);color:var(--yellow-ink);padding:3px 10px;border-radius:8px;flex:none}
.ovr.age{background:var(--plate);color:var(--plate-fg)}
.ovr.age small{color:var(--yellow)}
.ovr small{font:800 10px var(--body);letter-spacing:.1em}
.ovr b{font:800 21px var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pane{display:flex;flex-direction:column;gap:10px}
.kick{font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.ph h1{font-size:22px;line-height:1.1}
.ph p{color:var(--mut);margin-top:4px;font-size:14px;max-width:46ch}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.seg{height:7px;background:var(--line);border-radius:3px}
.seg.win{background:var(--purple)}.seg.pod{background:var(--green)}.seg.pts{background:var(--amber)}.seg.none{background:var(--neutral)}.seg.dnf{background:var(--warn)}
.seg.now{background:var(--fg);opacity:.3}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mut)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);animation:in .2s ease-out}

.opts{display:grid;gap:7px}

.ch.sel{border-color:var(--fg);background:var(--soft)}
.lt{width:26px;height:26px;border-radius:6px;background:var(--yellow);color:var(--yellow-ink);font:800 13px var(--display);display:grid;place-items:center}
.cb{display:flex;flex-direction:column;gap:2px;min-width:0}
.ot{font:700 15px/1.2 var(--display);letter-spacing:-.02em}

.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.tg{font:600 11px var(--body);padding:1px 6px;border:1px solid var(--line);border-radius:6px;color:var(--mut)}
.tg.r0{color:var(--green)}.tg.r1{color:var(--amber)}.tg.r2{color:var(--warn)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font:700 12px var(--body);padding:2px 7px;border-radius:6px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip.up{color:var(--green)}.chip.down{color:var(--warn)}.chip.pt{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
.dock{position:sticky;bottom:calc(60px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;pointer-events:none;margin-top:4px}
.dock>*{pointer-events:auto}
@supports (-webkit-touch-callout:none){body{min-height:calc(100vh + 1px)}}
.go{flex:1;background:var(--btn-bg);color:var(--btn-fg);border:0;border-radius:10px;padding:12px 16px;font:800 15px var(--display);letter-spacing:-.01em;cursor:pointer;box-shadow:0 6px 20px rgba(13,27,61,.25)}
.go.yel{background:var(--yellow);color:var(--yellow-ink)}
.go:disabled{opacity:.4;cursor:not-allowed}
.back{background:var(--panel);border:1.5px solid var(--fg);color:var(--fg);border-radius:10px;padding:10px 16px;font:800 15px var(--display);cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:6px 10px;font:600 12px var(--body);cursor:pointer;align-self:flex-start}
.ghost:hover{color:var(--fg);border-color:var(--fg)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.resrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.big{font:800 44px/1 var(--display);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.k-win{color:var(--purple)}.k-pod{color:var(--green)}.k-pts{color:var(--amber)}.k-none{color:var(--mut)}.k-dnf{color:var(--warn)}
.tw{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:28px 4px minmax(0,1fr) auto;gap:8px;align-items:center;padding:4px 6px;border-bottom:1px solid var(--line);font-size:13.5px}

.sq{width:4px;height:16px;border-radius:2px;background:var(--c);display:inline-block}
.nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.gp{font-weight:400;font-size:10.5px;color:var(--mut);opacity:.6;margin-right:7px}
.pt{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.row.me{background:var(--me);border-radius:8px;border-bottom-color:transparent;font-weight:700}

.row.gap{grid-template-columns:1fr;text-align:center;color:var(--mut);padding:2px;border:0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
input[type=text],input[type=search]{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--fg);font:600 15px var(--body);width:100%}
input:focus{border-color:var(--fg)}
.idgrid{display:grid;grid-template-columns:minmax(0,1fr) 78px;gap:8px}
.plate{align-self:flex-start;min-width:76px;height:52px;padding:0 10px;border-radius:8px;background:var(--plate);color:var(--yellow);display:grid;place-items:center;font:800 30px var(--display);letter-spacing:-.04em;outline:2px solid var(--yellow);outline-offset:-5px}
.plate.empty{color:var(--mut)}
.plate.sm{min-width:56px;height:44px;font-size:22px;outline-offset:-4px;flex:none}
.ctys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;max-height:230px;overflow-y:auto;padding:2px}
.cty{display:flex;align-items:center;gap:10px;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;text-align:left;cursor:pointer;min-width:0}

.cty.sel{border-color:var(--fg);background:var(--soft);font-weight:700}
.fl{font-size:17px;flex:none}
.idrow{display:flex;gap:10px;align-items:center}
.idtxt{min-width:0}

.sub{color:var(--mut);font-size:12.5px}
.srs{display:flex;flex-direction:column;gap:7px}
.sr{display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:end}

.bar{height:6px;background:var(--soft);border-radius:2px;overflow:hidden}

.dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}

.dl div:nth-last-child(-n+3){border-bottom:0}
.dl b{display:block;font:800 19px/1.1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}

.stack{display:flex;flex-direction:column;gap:9px}
.offer{display:flex;flex-direction:column;gap:7px;text-align:left;background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:10px;padding:9px 12px 11px;cursor:pointer;width:100%;box-shadow:var(--shadow)}

.oft{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

.ser{font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);white-space:nowrap;padding-top:2px}

.kd{font:800 11px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;display:inline-block;margin-right:6px}

.sb{padding:9px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.sbt{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sbt b{font:800 15px/1.15 var(--display);letter-spacing:-.02em}
.pp{font:800 15px var(--display);background:var(--soft);padding:2px 8px;border-radius:6px;flex:none}
.pp.ok{background:var(--good-bg);color:var(--green)}
.mini{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}

.lst{display:flex;flex-direction:column;gap:3px;font-size:12.5px}

.chipm{display:inline-flex;gap:6px;align-items:center}
.dt{width:4px;height:12px;border-radius:2px;background:var(--c);display:inline-block;flex:none}
.news{font-size:12.5px;color:var(--mut);border-top:1px solid var(--line);padding-top:5px}
.empty{color:var(--mut);text-align:center;padding:24px 12px;font-size:13px}

.ccat.no{opacity:.5}.sect2{margin-top:14px;font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.tblwrap{overflow-x:auto}

td.n{font-variant-numeric:tabular-nums}
.card{border-left:4px solid var(--yellow)}

.ovr{box-shadow:0 2px 8px rgba(255,210,58,.35)}

.st.s1{background:var(--yellow);color:var(--yellow-ink)}
.gt{display:block}.gt.mine{border:2px solid var(--yellow);background:rgba(255,214,0,.12);border-radius:12px;padding:8px 10px 2px;margin:4px -4px}

.achg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.ach{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12px;opacity:.5}

function carQ(){
  const c=S.teams.map((t,i)=>t.car+(i===S.teamRank?S.carBonus:0)),me=c[S.teamRank];

/* adattamento di un piano alle condizioni: x = condizioni (vere o ipotizzate), s = peso safety car 0..1 */
function planFit(k,x){

      case 'soft':f=P.soft[0]+P.soft[1]*d+P.soft[2]*o+P.soft[3]*g+P.soft[4]*s;break;
      case 'under':f=P.under[0]+P.under[1]*d+P.under[2]*o+P.under[3]*Math.abs(g)+P.under[4]*s;break;
      case 'over':f=P.over[0]+P.over[1]*d+P.over[2]*o+P.over[3]*g+P.over[4]*s;break;

      if(rk==='one'&&k==='soft')f+=.05;

const P={one:[.54,-.28,.06,-.3,.01],two:[.66,.15,.3,-.11,-.14],soft:[.52,-.25,.27,.25,-.22],under:[.79,-.03,-.29,-.31,-.1],over:[.46,-.15,-.27,.3,.25],safe:[.2,.45]};
const xOf=(w,s,rvk)=>({rain:w.rain,mixed:w.mixed,wear:w.wear,ta:w.ta,ovt:w.ovt,gp:w.gp,N:w.N,s,rv:w.rv,rvk,ri:w.wx?w.wx.ri:undefined,rt:w.wx?w.wx.rt:undefined});

/* valore atteso di un piano date le informazioni che il giocatore possiede */
function fitEV(k,w){
  const d=S.diff==null?1:S.diff,kn=w.kn;
  const W=kn.wear?[w.wear]:w.vw,O=kn.ovt?[w.ovt]:d===2?[0,1,2]:w.vo,SS=kn.sc?[w.sck]:d===2?[0,1,2]:w.vs;
  const s=SS.reduce((a,i)=>a+SCP[i],0)/SS.length,pr=w.rp/100,pm=w.rp<60?.5:0;

  for(const wr of W)for(const ov of O)for(const [rn,mx,p] of R){

const bestPlan=w=>PL.map(p=>[p.k,fitEV(p.k,w)]).sort((a,b)=>b[1]-a[1])[0];
const bestReal=w=>PL.map(p=>[p.k,fitReal(p.k,w)]).sort((a,b)=>b[1]-a[1])[0];
function mkWk(){

  const r0=rnd(),rp=Math.round((r0<.55?rnd()*25:r0<.85?25+rnd()*30:55+rnd()*35)/5)*5;

  w.tk=Math.max(1,w.tk);w.tk0=w.tk;{const lv=ckLv(name);if(lv>=2)w.kn.wear=true;if(lv>=3)w.kn.ovt=true}w.sp=pickSp(name);applySp(w);engWk(w);w.fmt=pickFmt();

  {const r=rnd();w.rv=r<.45?rk[0][0]:r<.8?rk[1][0]:rk[2][0]}
  w.ord=shuffle(PL.map((p,i)=>i));w.rd=S.round;w.q=mkQ(w,c);if(mf()>=65){const bq=QL.map(p=>p.k).sort((a,b)=>qEV(b,w)-qEV(a,w))[0];w.qhint=rnd()<.72?bq:pick(QL.map(p=>p.k).filter(x=>x!==bq))}

const verdictOf=l=>l<.05?0:l<.16?1:l<.32?2:3;
function choosePlan(i){
  const w=S.wk,p=PL[i],fr=fitReal(p.k,w),fe=fitEV(p.k,w),bk=bestPlan(w),br=bestReal(w),loss=bk[1]-fe,vd=verdictOf(loss);
  const tb=mf()>=70?.5:mf()<=30?-.5:0;
  const v=(fr-PCV)*KD()+tb;
  const rk=({soft:.02,under:.01,inter:w.rain?0:.03,one:0,two:0,over:0,safe:0})[p.k]+(fr<.3?.02:0);
  S.sw={i,k:p.k,fit:fr,fe,best:bk[0],bestFit:bk[1],hind:br[0],hindFit:br[1],vd,v:Math.round(v*10)/10,risk:rk,loss,luck:fr-fe,kn:{...w.kn}};

const DEGL=['molto basso','basso','medio','alto','molto alto'],WL=['Bassa','Media','Alta'],OL=['Difficili','Medi','Facili'],SL=['Basso','Medio','Alto'];
function why(k,w){
  const u=w.u,ov=w.ovt,g=w.gp;let t;

    if(k==='inter')t=w.mixed?'La pioggia a tratti ha premiato le intermedie.':'Pioggia piena: le intermedie sono state la mossa vincente.';
    else if(k==='safe')t='I rivali non erano pronti alla pioggia, e tu con loro.';
    else t=w.mixed?'La pioggia a tratti ha creato caos: le gomme scelte non erano ideali.':'La pioggia ha ribaltato i piani: senza gomme da bagnato hai pagato.';
  }else switch(k){
    case 'inter':t='Pista asciutta: le intermedie si sono consumate nei primi giri.';break;
    case 'one':t=u<=1?'Degrado basso: la sosta unica ha retto senza problemi.':u>=3?'Degrado '+DEGL[u]+' (usura'+(w.ta>0?' e caldo':'')+'): una sola sosta ti ha costretto a rallentare.':'La sosta unica ha retto, ma al limite.';break;
    case 'two':t=u>=3?'Con un degrado '+DEGL[u]+' due soste hanno tenuto le gomme fresche.':u<=1?'Il degrado era basso: la sosta in più è stata tempo perso.':'Due soste: un compromesso solido.';break;
    case 'soft':t=ov===2?'Sorpassi facili: l\'attacco ha reso.':ov===0?'Dove è difficile sorpassare, l\'attacco non ha pagato.':'Un attacco senza grandi guadagni.';t+=g>=Math.round(w.N*.6)?' Partire dalle retrovie giustificava il rischio.':g<=4?' Partendo davanti non serviva rischiare.':'';break;
    case 'under':t=ov===0?'Dove sorpassare è difficile, anticipare la sosta ha dato posizioni in pista.':'Sorpassare era facile: l\'undercut ha dato poco.';break;
    case 'over':t=u<=1?'Gomme che durano: restare fuori a lungo ha pagato.':'Con un degrado '+DEGL[u]+' la sosta tardiva è costata cara.';break;
    default:{const rp=PL.find(p=>p.k===w.rv);t='I rivali hanno scelto «'+rp.n.split(' · ')[0].toLowerCase()+'»: '+((w.rvFit||0)>=.7?'una buona scelta, che hai potuto copiare.':'non era quella ottimale, e l\'hai seguita.')}

    const r=RACES.find(x=>x.id===S.cur),base=(S.pendI>=0&&r)?r.o[S.pendI]:DEF,mo=MOMS.find(x=>x.id===S.mom),m=mo.o[i],cx=momCtx(mo.id,i);
    S.mm=(cx.g||cx.b)?{id:mo.id,g:cx.g,b:cx.b}:null;

    S.last.mom=m.out+cx.txt;radioMom();buzz();S.phase='result';save();render();
  }else if(a==='ev'){
    const e=evOf();let o=e.dev?devResolve(e,e.o[i]):e.o[i];if(o.ch!=null&&o.alt&&rnd()>=o.ch)o={...o,...o.alt,imp:1};
    const fx=applyFx(o.fx);if(o.rv&&S.riv&&S.hh)S.hh[S.riv.n]=clamp((S.hh[S.riv.n]||0)+o.rv,0,100);if(o.mv){const mm=mateOf();if(mm){S.hh=S.hh||{};S.hh[mm.n]=clamp((S.hh[mm.n]||0)+o.mv,0,100)}}if(o.sm)addSm(o.sm);S.ev={imp:o.imp,out:o.out+(o.note?' '+o.note:''),fx,sm:o.sm?{...S.sm}:null};S.phase='evres';if(e.id==='eng')engEvent(i);save();render();
  }else if(a==='next'){
    S.newA=[];
    if(S.phase==='batch'){if(S.step>=S.steps.length)seasonEnd();else enterStep()}
    else{if(!(S.phase==='result'&&S.last&&S.last.sim))S.step++;advance()}
  }else if(a==='skip'){
    if(S.last&&S.last.sim){const nx=S.steps[S.step],tg=S.auto?S.total:(nx?nx.at:S.total);while(S.round<tg)doRace(null);if(S.auto){S.auto=false;S.step=S.steps.length;seasonEnd()}else enterStep()}
    else{S.step++;advance()}
  }else if(a==='auto'){
    while(S.round<S.total)doRace(null);
    S.auto=false;S.step=S.steps.length;seasonEnd();
  }else if(a==='toOffers'){
    achCheck();

    S.mkt=[];evolveAll();S.offers=makeOffers();S.phase='offers';save();render();

  }else if(a==='again'){S=null;VIEW='home';render()}
}

let GT=null;
function ensureSh(){
  if(S.sh&&S.sh.y===S.year&&S.sh.tier===S.tier)return;
  const sh={y:S.year,tier:S.tier,T:{}};
  [0,1,2,3].forEach(i=>{
    if(i===S.tier)return;
    const Tt=TIERS[i],rows={};
    for(let t=0;t<Tt.teams.length;t++)(S.pool[i]||[]).filter(d=>d.t===t).sort((a,b)=>b.o-a.o).slice(0,2).forEach(d=>{rows[d.n]={n:d.n,t,o:d.o,pts:0,w:0}});
    sh.T[i]={r:0,rows,car:Tt.teams.map((_,t)=>carNext(i,t,regOf(S.year,i)))};
  });
  S.sh=sh;
}
function shSim(upTo){
  ensureSh();
  [0,1,2,3].forEach(i=>{
    const x=S.sh.T[i];if(!x)return;
    const len=(S.cals&&S.cals[i]?S.cals[i].length:TIERS[i].cal.length);
    const tg=upTo==null?len:Math.min(len,Math.round(S.round/S.total*len));
    const tab=(S.rl&&S.rl.p12)?[25,18,15,12,10,8,6,5,4,3,2,1]:PTS;
    while(x.r<tg){
      x.r++;
      const E=Object.values(x.rows).map(d=>({d,dnf:rnd()<.07,p:.55*d.o+.45*x.car[d.t]+gauss()*4.6}));
      const fin=E.filter(e=>!e.dnf).sort((a,b)=>b.p-a.p);
      fin.forEach((e,k)=>{if(k<tab.length)e.d.pts+=tab[k];if(k===0)e.d.w++});
      if(i===3)ktSh(E,fin,tab);
    }
  });
}
function shRows(i){
  ensureSh();const x=S.sh.T[i];if(!x)return[];
  return Object.values(x.rows).sort((a,b)=>b.pts-a.pts||b.w-a.w||a.n.localeCompare(b.n)).map((d,k)=>({n:d.n,t:d.t,pos:k+1,pts:d.pts,me:false}));

const ktG=n=>{
  S.kt=S.kt||{};
  let k=S.kt[n];
  if(!k){const b=KT0[n]||[0,0,0,0,0,0,0,0];k=S.kt[n]={w:b[0],p:b[1],pl:b[2],fl:b[3],pt:b[4],pf:b[5],r:b[6],t:b[7],cs:0,bw:0,sw:0,sp:0,spl:0,spt:0}}

};
function ktSeas(){if(!S.kt)return;for(const n in S.kt){const k=S.kt[n];k.sw=0;k.sp=0;k.spl=0;k.spt=0}}
function ktRace(order,pole){
  order.forEach(e=>{
    if(e.me)return;
    const k=ktG(e.n);k.r++;
    if(pole&&e.n===pole){k.pl++;k.spl++}
    if(e.dnf){k.cs=0;return}
    if(e.pos===1){k.w++;k.sw++;k.cs++;if(k.cs>k.bw)k.bw=k.cs}else k.cs=0;
    if(e.pos<=3){k.p++;k.sp++}
    if(e.pts>0){k.pf++;k.pt+=e.pts;k.spt+=e.pts}
  });
  const top=order.filter(e=>!e.dnf&&e.pos<=8),W=[5,4,3,3,2,2,1,1];
  if(top.length){
    let tot=0;top.forEach(e=>tot+=W[e.pos-1]);let r=rnd()*tot,pk=top[0];
    for(const e of top){r-=W[e.pos-1];if(r<=0){pk=e;break}}
    if(!pk.me)ktG(pk.n).fl++;
  }
}
function ktSh(E,fin,tab){

  ktRace(order,pl);
}

function dhTrack(){
  S.dh=S.dh||{};
  const add=(n,ti,t,pos,pts,w)=>{
    const a=S.dh[n]||(S.dh[n]=[]);
    if(a.length&&a[a.length-1][0]===S.year&&a[a.length-1][1]===ti)return;
    a.push([S.year,ti,t,pos,Math.round(pts),w||0]);if(a.length>30)a.shift();
  };
  standings().forEach((x,k)=>{if(!x.me)add(x.n,S.tier,x.t,k+1,x.pts,x.w)});
  [0,1,2,3].forEach(i=>{
    if(i===S.tier)return;
    const x=S.sh&&S.sh.T[i];if(!x)return;
    shRows(i).forEach((d,k)=>add(d.n,i,d.t,k+1,d.pts,x.rows[d.n]?x.rows[d.n].w:0));
  });
  const live=new Set();S.pool.forEach(P=>P.forEach(d=>live.add(d.n)));
  for(const n in S.dh){if(!live.has(n)){const a=S.dh[n];if(!a.length||a[a.length-1][0]<S.year-5)delete S.dh[n]}}
}

/* ---------- Qualifica interattiva ---------- */
const QEVO=['bassa','media','alta'];
function makeGrid(qv,E0,ref){
  const w=S.wk;
  const base=E0?E0.map(x=>({...x})):qBase().map(e=>({n:e.n,t:e.t,me:!!e.me,q:e.p*.9+gauss()*3.8}));
  const rank=a=>a.slice().sort((x,y)=>y.q-x.q);
  if(w&&!E0)w.qE=base.map(x=>({...x}));
  const g0=rank(base).findIndex(x=>x.me)+1;
  base.find(x=>x.me).q+=qv;
  const a=rank(base),b=70+(S.cal[S.round].length*7%25);
  const pn=gridPen(a);
  const r0=ref!=null?ref:a[0].q;
  if(w&&ref==null)w.qRef=r0;
  a.forEach((x,i)=>{x.g=i+1;x.tm=b+(r0-x.q)*.07});
  return{rows:a,g:a.find(x=>x.me).g,g0:Math.min(a.length,g0+pn),pn};
}
function qTail(w){

  {const r=rnd();w.rv=r<.45?rk[0][0]:r<.8?rk[1][0]:rk[2][0]}
  w.hint=undefined;
  if(mf()>=65){const bk2=bestPlan(w)[0];w.hint=rnd()<.72?bk2:pick(PL.map(p=>p.k).filter(x=>x!==bk2))}
}
function chooseQuali(i,auto){
  const w=S.wk,q=w.q,lim=(i===3),k=lim?'lim':QL[i].k,fr=lim?.6:qReal(k,w),fe=lim?.58:qEV(k,w),bk=qBest(w),loss=bk[1]-fe;let vd=verdictOf(loss);
  const tb=mf()>=70?.3:mf()<=30?-.3:0,qv=qxF(w,(fr-.55)*QK+tb+ckB(w.c)*.5+(w.fpq||0)+(lim?gauss()*.5:0),lim);
  w.pen0=S.pen||0;
  const G=makeGrid(qv);
  if(lim)vd=qv>=1?0:qv>=.3?1:qv>=-.3?2:3;
  w.grid=G.rows;w.gp=G.g;w.pn=G.pn||0;w.gpx=1;w.qc=qv*QCARRY;w.rd=S.round;w.qv1=qv;w.a2=0;
  if(!auto)S.mf=clamp(mf()+[1,0,0,-1][vd],0,100);
  w.qs={k,vd,qv:Math.round(qv*10)/10,g:G.g,g0:G.g0,best:bk[0],auto:auto?1:0,el:(w.eq&&w.eq.out)?1:0,rain:q.rain,red:q.red,t:q.t,e:q.e,s:q.s};
  wxUpdate(w);qTail(w);
  w.ql=auto?null:{t:'std'};
  S.phase=auto?'strat':'qlive';
}
function q2Info(w){
  const q=w.q;
  return{evo:[.25,.45,.7][q.e+1],tp:[0,.15,.4][q.t+1],err:clamp(.12+(q.t+1)*.05+(q.rain?.08:0)-(mf()>=70?.03:0),.06,.3)};
}
function qSecond(){
  const w=S.wk,q=w.q,I=q2Info(w);

  const err=rnd()<I.err;

  w.grid=G.rows;w.gp=G.g;w.pn=G.pn||0;w.qc=qv2*QCARRY;w.tyb=(w.tyb||0)-.2;w.a2=1;
  w.qs.g=G.g;w.qs.a2={err:err?1:0,g1,d:g1-G.g};

function qlBoard(rows,prev,cut){

/* ---------- Qualifica a eliminazione (Q1 · Q2 · Q3) ---------- */
const EXO=[
 {k:'soft',n:'Morbide nuove',d:'Il giro più veloce, ma bruci un set nuovo: in gara avrai gomme più usate.',pace:1.5,ty:-.12,tg:'Gara −'},
 {k:'med',n:'Gomme medie',d:'Compromesso: tempo discreto e un set nuovo risparmiato per la gara.',pace:.6,ty:0,tg:'Gara neutra'},
 {k:'hard',n:'Gomme dure usate',d:'Salvi il materiale migliore per la gara, ma il taglio si fa stretto.',pace:-.8,ty:.1,tg:'Gara +'}];
const EXO3=[EXO[0],{k:'softu',n:'Morbide già usate',d:'Un po\' più lente, ma tieni un set nuovo per la gara.',pace:.9,ty:-.04,tg:'Gara −'},{k:'med',n:'Gomme medie',d:'Pole fuori portata, ma gara protetta.',pace:.3,ty:.05,tg:'Gara +'}];
const exOpts=s=>s===2?EXO3:EXO;
const exBonus=w=>(mf()>=70?.3:mf()<=30?-.3:0)+ckB(w.c)*.5+(w.fpq||0);
function exEnsure(w){
  if(w.ex)return;
  const E=qBase(),N=E.length,out=Math.max(2,Math.round(N*.25));
  const ex={s:0,N,out:0,cut:out,k1:N-out,k2:N-2*out,mu:{},t:{},alive:E.map(e=>e.n),res:[],fin:{},pc:[],auto:0};
  E.forEach(e=>{ex.mu[e.n]=e.p*.9;ex.t[e.n]=e.t});
  w.ex=ex;
}
function exProb(w,i){
  const ex=w.ex,s=ex.s,O=exOpts(s)[i],me=abbr(S.name),R=mul32(hsh(w.c+'|x|'+s+'|'+O.k+'|'+S.year+'|'+S.round));
  const g=()=>{let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*v)};
  const keep=s===0?ex.k1:s===1?ex.k2:2,others=ex.alive.filter(n=>n!==me).map(n=>ex.mu[n]),b=exBonus(w);
  let ok=0;const M=70;
  for(let m=0;m<M;m++){
    const qp=ex.mu[me]+O.pace+b+g()*3.8;let above=0;
    for(const mu of others)if(mu+g()*3.8>qp)above++;
    if(above<keep)ok++;
  }
  return ok/M;
}
function exLbl(p,s){
  if(s===2)return p>=.55?['Prima fila probabile',0]:p>=.3?['Prima fila possibile',1]:['Prima fila difficile',2];
  return p>=.9?['Taglio sicuro',0]:p>=.7?['Taglio probabile',0]:p>=.45?['Taglio in bilico',1]:['Taglio a rischio',2];
}
function exRun(w,O){
  const ex=w.ex,s=ex.s,me=abbr(S.name),b=70+(S.cal[S.round].length*7%25);
  const rows=ex.alive.map(n=>({n,t:ex.t[n],me:n===me,q:ex.mu[n]+(n===me&&O?O.pace+exBonus(w):0)+gauss()*3.8}));
  rows.sort((a,c)=>c.q-a.q);
  const keep=s===0?ex.k1:s===1?ex.k2:rows.length,r0=rows[0].q,so=[.9,.45,0][s];
  rows.forEach((x,k)=>{x.tm=b+so+(r0-x.q)*.07;x.g=k+1});
  if(s<2)rows.slice(keep).forEach((x,k)=>{ex.fin[x.n]={g:keep+k+1,tm:x.tm}});
  else rows.forEach((x,k)=>{ex.fin[x.n]={g:k+1,tm:x.tm}});
  ex.res.push({s,keep,rows:rows.map(x=>({n:x.n,t:x.t,me:x.me,g:x.g,tm:Math.round(x.tm*1000)/1000}))});
  ex.alive=rows.slice(0,keep).map(x=>x.n);
  if(O&&!ex.alive.includes(me)&&!ex.out)ex.out=s+1;
  ex.s=s+1;
}
function exFinal(w){
  const ex=w.ex,me=abbr(S.name);

  const a=Object.keys(ex.fin).map(n=>({n,t:ex.t[n],me:n===me,g:ex.fin[n].g,tm:ex.fin[n].tm,q:ex.mu[n]})).sort((x,y)=>x.g-y.g);
  const g0=Object.keys(ex.mu).sort((x,y)=>ex.mu[y]-ex.mu[x]).indexOf(me)+1;
  const pn=gridPen(a);
  a.forEach((x,i)=>{x.g=i+1});
  if(pn){const m=a.find(x=>x.me),i=a.indexOf(m),up=a[i-1],dn=a[i+1];m.tm=dn?(up.tm+dn.tm)/2:up.tm+.05}

  w.gp=mg;w.pn=pn||0;w.gpx=1;w.rd=S.round;
  const pc=ex.pc.length?ex.pc.reduce((x,y)=>x+y,0)/ex.pc.length:0;
  const qv=(ex.out?-1.2:(pc-.6))+exBonus(w);
  w.qc=qv*QCARRY;
  const dg=Math.min(a.length,g0+pn)-mg,vd=dg>=3?0:dg>=0?1:dg>=-3?2:3;
  if(!ex.auto)S.mf=clamp(mf()+[1,0,0,-1][vd],0,100);
  w.qs={k:'el',vd,qv:Math.round(qv*10)/10,g:mg,g0:Math.min(a.length,g0+pn),best:'el',auto:ex.auto?1:0,el:1,ex:{out:ex.out},rain:w.q.rain,red:w.q.red,t:w.q.t,e:w.q.e,s:w.q.s};
  wxUpdate(w);qTail(w);
}
function exStage(i){

  if(ex.alive.includes(me)&&s<2){w.ql={t:'st',s,fin:0};S.phase='qlive';return}

function exNext(){
  const w=S.wk;if(w.ql&&w.ql.fin){w.ql=null;S.phase='strat';return}
  w.ql=null;S.phase='quali';

function exAutoPick(w){

function exAutoAll(){

function exStageView(){
  const w=S.wk,ex=w.ex,ql=w.ql,me=abbr(S.name),r=ex.res[ql.s],mi=r.rows.find(x=>x.me);
  const cutN=ql.s<2?r.keep:0,fin=ql.fin;

  if(ql.s===2&&mi)msg=`<b>${mi.g===1?'Pole position!':'Q3: P'+mi.g}</b> · partirai da <b>P${w.gp}</b>${w.pn?` (con ${w.pn} posizioni di penalità)`:''}.`;
  else if(mi&&fin)msg=`<b style="color:var(--warn)">Eliminato in Q${ql.s+1}</b> · chiudi P${mi.g}: partirai da <b>P${w.gp}</b>${w.pn?` (con ${w.pn} posizioni di penalità)`:''}. In compenso avrai gomme fresche per la gara.`;
  else if(mi){const m=mi.g===cutN?' per un soffio':'';msg=`<b style="color:var(--green)">Passi in Q${ql.s+2}</b>${m} · P${mi.g}, il taglio è alla posizione ${cutN}.`}

  <div class="qsl">${msg}</div>
  <section class="card"><div class="sech">Classifica Q${ql.s+1}</div>${qlBoard(r.rows,null,cutN)}</section>

function exView(){
  const w=S.wk,q=w.q;exEnsure(w);

  const tile=(ic,lab,big,sub)=>`<div class="bt"><small class="bl">${ico(ic)} ${lab}</small><b>${big}</b><small class="bs">${sub}</small></div>`;
  const vg=q.vt[0]!==q.vt[1],tb=vg?L3[q.vt[0]+1]+' – '+L3[q.vt[1]+1]:L3[q.t+1];
  const expl=s===0?`<div class="qsl"><b>🎯 Qualifica a eliminazione.</b> Tre sessioni: in <b>Q1</b> restano fuori gli ultimi ${ex.cut} (da P${ex.k1+1}), in <b>Q2</b> altri ${ex.cut}, in <b>Q3</b> i migliori ${ex.k2} si giocano la pole. Ad ogni sessione scegli le gomme: le morbide nuove sono le più veloci, ma in gara ne sentirai la mancanza.</div>`
    :`<div class="qsl">${s===1?`<b>Q2</b>: restano fuori gli ultimi ${ex.cut}. Sei ancora in gioco, scegli le gomme.`:'<b>Q3</b>: l\'ultima sessione decide la pole.'}${ex.pc.length?` <small>Gomme finora: ${w.tyb<0?'consumate':'risparmiate'}.</small>`:''}</div>`;
  return `<div class="ph"><div class="kick">Weekend ${S.round+1} di ${S.total} · ${esc(w.c)}</div><h1>Qualifica · Q${s+1}</h1><p>${s===0?'Con quali gomme esci per il tuo primo giro?':s===1?'Q1 superata: ora tocca a Q2.':'Sei tra i migliori: gioca la pole.'}</p></div>
  ${spLine(w)}${fmLine(w)}${ckLine(w.c)}<section class="card brf"><div class="gauges qg">${tile('cloud','Pioggia',w.rp+'%','prob. di pioggia')}${tile('chart','Pista',L3[q.e+1],'evoluzione')}${tile('ovt','Traffico',tb,vg?'stima':'previsto')}${tile('bolt','Rettilinei',['Corti','Medi','Lunghi'][q.s+1],'utili per la scia')}</div></section>
  ${expl}${obCard(w)}${puCard(w)}
  <div class="opts">${O.map((o,i)=>{const p=exProb(w,i),l=exLbl(p,s);return `<button class="ch" data-act="ex" data-i="${i}"><span class="lt">${LT[i]}</span><span class="cb"><span class="ot">${o.n}</span><span class="od">${o.d}</span><span class="tags"><span class="tg r${l[1]}">${l[0]}</span><span class="tg">${o.tg}</span></span></span></button>`}).join('')}</div>
  <div class="btns"><button class="ghost" data-act="exauto">Lascia decidere al muretto</button></div>`;
}
function elimLine(s){
  const o=s.ex?s.ex.out:0;
  return o?`<div class="qsl"><div><b style="color:var(--warn)">Eliminato in Q${o}</b> · qualifica a eliminazione</div><div>Il taglio è andato male: partirai da P${s.g}. In compenso hai gomme più fresche per la gara.</div></div>`
    :`<div class="qsl"><div><b style="color:var(--green)">Q3 raggiunta</b> · qualifica a eliminazione</div><div>Hai passato entrambi i tagli e chiudi la qualifica in P${s.g}.</div></div>`;
}
function qsLine(s){
  if(s.el)return elimLine(s);
  const vd=QVD[s.vd],p=QL.find(x=>x.k===s.k)||QLIM,dg=s.g0-s.g;
  return `<div class="qsl"><div><b style="color:${vd[1]}">${vd[0]}</b> · ${p.n}${s.auto?' <small>(scelta del muretto)</small>':''}</div><div>${qWhy(s)}${dg?` <b>${dg>0?'+':''}${dg} posizioni</b> rispetto a una scelta neutra.`:''}</div></div>`;
}
function wxHint(w){
  if(!w.rain||!w.wx||w.mixed||w.wxh)return;
  w.wxh=rnd()<(.7+(S.eng&&S.eng.k==='met'?.1:0))?w.wx.rt:['keep','stop','worse'].filter(x=>x!==w.wx.rt)[Math.floor(rnd()*2)];
}
function wkInit(w){
  w.ob={o:obGen(w),sel:0};
  if(w.fmt&&w.fmt!=='std')S.fmLast=S.round;
  puWeekend(w);
  wxInit(w);
  if(w.kn&&w.kn.rain)wxHint(w);
}
render();
document.addEventListener('click',e=>{if(VIBON&&e.target.closest('[data-act],.nv')&&navigator.vibrate)try{navigator.vibrate(8)}catch(_){}} ,true);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
