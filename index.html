/* =====================================================================
   v5 · R · Costruttore di stint: mescole, soste e durata delle gomme
   (complessità crescente da F4 a F1). Il piano scelto resta quello dei
   7 piani del gioco: il costruttore lo traduce e aggiunge solo un
   piccolo bonus/malus legato a quanto gli stint rispettano la vita
   delle gomme.
   ===================================================================== */
const TY={
  /* vita base in giri (usura media, spinta standard) */
  life:[{S:12,M:20,H:99},{S:11,M:16,H:22},{S:14,M:22,H:31},{S:17,M:28,H:38}],
  unc:[.15,.12,.10,.08],           /* incertezza della stima (con usura nota) */
  pit:[24,23,21,20],               /* secondi persi per una sosta */
  pace:{S:0,M:.30,H:.55},          /* secondi per giro rispetto alla morbida */
  stops:[[0,1],[1,2],[1,3],[1,3]], /* soste consentite */
  cps:[['S','M'],['S','M','H'],['S','M','H'],['S','M','H']],
  min:[3,4,5,6],                   /* giri minimi di uno stint */
  step:[1,1,1,2],
  pm:[.6,.8,1,1]                   /* effetto della spinta, per categoria */
};
const tyT=()=>Math.max(0,Math.min(3,S.tier|0));
const tyLaps=()=>LAPS[tyT()];
/* gauss deterministico da una chiave (non consuma il generatore casuale) */
function hg(k){
  const a=(hsh(k+'a')+1)/4294967297,b=(hsh(k+'b')+1)/4294967297;
  return Math.sqrt(-2*Math.log(a))*Math.cos(2*Math.PI*b);
}
const hu=k=>(hsh(k+'u')+1)/4294967297;
/* gestione gomme del pilota (0..1 centrato su 0.5) */
const tyDrv=()=>clamp((((S.st.costanza+S.st.tecnica)/2)-30)/60,0,1);
/* vita (giri) di una mescola: u = degrado 0..4, p = spinta -1/0/1, d = gestione */
function tyLife(c,u,p,d,tier){
  const L0=TY.life[tier==null?tyT():tier][c]||30;
  return L0*(1-.13*(u-2))*(1-.17*(p||0)*TY.pm[tier==null?tyT():tier])*(1+(d-.5)*.2);
}
/* usura "effettiva" che il pilota conosce (o i due valori possibili) */
function tyUs(w){
  if(w.kn&&w.kn.wear)return[w.u];
  const v=w.vw||[w.wear,w.wear];
  return v.map(x=>clamp(x+1+w.ta,0,4));
}
/* stima della vita di uno stint: [centro, minimo, massimo] */
function tyEst(w,c,p){
  const d=tyDrv(),us=tyUs(w),t=tyT();
  const ls=us.map(u=>tyLife(c,u,p,d,t)),lo=Math.min(...ls)*(1-TY.unc[t]),hi=Math.max(...ls)*(1+TY.unc[t]);
  /* la forchetta si stringe con le prove libere / i consulti: kn.wear già lo include */
  return[(Math.min(...ls)+Math.max(...ls))/2,lo,hi];
}
/* vita reale in gara (stessa per tutti i piloti, rumore condiviso) */
function tyReal(w,c,p,d){
  const g=clamp(w.dg==null?0:w.dg,-1.6,1.6);
  return tyLife(c,w.u,p,d==null?tyDrv():d,tyT())*(1+.055*g);
}
/* secondi persi da uno stint: ritmo della mescola + degrado + clif oltre il limite */
function tyStint(len,L,c,p){
  let t=(TY.pace[c]||0)*len-.2*(p||0)*TY.pm[tyT()]*len;
  for(let i=1;i<=len;i++){
    t+=2.4*Math.pow(i/L,2.2);
    if(i>L)t+=.7*(i-L);
  }
  return t;
}
/* costo totale (s) di una configurazione, data la "vita" di ogni stint */
function tyCost(cfg,lifeOf){
  const T=tyLaps(),n=cfg.c.length;let t=(n-1)*TY.pit[tyT()],a=0;
  for(let j=0;j<n;j++){
    const e=j<n-1?cfg.e[j]:T,len=e-a;a=e;
    t+=tyStint(len,lifeOf(j),cfg.c[j],(cfg.p&&cfg.p[j])||0);
  }
  return t;
}
/* configurazioni predefinite dei sette piani */
function tyPre(k){
  const T=tyLaps(),t=tyT(),r=f=>Math.round(f*T);
  if(t===0){
    if(k==='soft')return{c:['S'],e:[],p:[0]};
    return{c:['M'],e:[],p:[0]};
  }
  switch(k){
    case 'two':return{c:t>=2?['M','H','M']:['M','M','M'],e:[r(.33),r(.66)],p:[0,0,0]};
    case 'soft':return{c:['S','S','M'],e:[r(.3),r(.6)],p:[0,0,0]};
    case 'under':return{c:['S','H'],e:[r(.3)],p:[0,0]};
    case 'over':return{c:['M','H'],e:[r(.68)],p:[0,0]};
    default:return{c:['H','M'],e:[r(.55)],p:[0,0]};
  }
}
/* da configurazione a piano (chiave tra quelle disponibili) + finestra */
function tyKey(cfg){
  const T=tyLaps(),t=tyT(),n=cfg.c.length-1,keys=planKeys(),has=k=>keys.includes(k);
  let k;
  if(n===0)k=cfg.c[0]==='S'?'soft':'one';
  else if(n===1){
    const e0=cfg.e[0]/T;
    if(cfg.c[0]==='S')k=e0<=.42?'under':'soft';
    else if(cfg.c[0]==='M'&&e0>=.6)k='over';
    else k='one';
  }else k=cfg.c[0]==='S'?'soft':'two';
  if(!has(k)){k=k==='under'?'soft':k==='over'?'one':k==='two'?'one':k}
  if(!has(k))k='one';
  let win=null;
  if(winAvail()&&winPlan(k)&&n>=1){
    const sd=T/(n+1),e0=cfg.e[0];
    win=e0<=sd*.85?'early':e0>=sd*1.15?'late':'std';
  }
  return{k,win};
}
/* valutazione della configurazione: bonus/malus rispetto al piano predefinito */
function tyDelta(w,cfg,real){
  const k=tyKey(cfg).k,pre=tyPre(k),d=tyDrv(),t=tyT();
  const lifeR=(c,p)=>real?tyReal(w,c,p,d):tyEst(w,c,p)[0];
  const cc=tyCost(cfg,j=>lifeR(cfg.c[j],(cfg.p&&cfg.p[j])||0));
  const cp=tyCost(pre,j=>lifeR(pre.c[j],0));
  const Z=tyLaps()*1.2;
  const dry=real?(w.rain?0:1):(w.kn&&w.kn.rain?(w.rain?0:1):1-w.rp/100);
  return clamp((cp-cc)/Z,-.12,.1)*dry;
}
/* configurazione valida? */
function tyOk(cfg){
  const t=tyT(),T=tyLaps(),n=cfg.c.length-1,msg=[];
  if(n<TY.stops[t][0]||n>TY.stops[t][1])msg.push('Numero di soste non consentito.');
  let a=0;
  for(let j=0;j<=n;j++){
    const e=j<n?cfg.e[j]:T;
    if(e-a<TY.min[t])msg.push('Lo stint '+(j+1)+' è troppo corto.');
    a=e;
  }
  if(t>=2&&n>=1&&!cfg.c.some(c=>c!==cfg.c[0]))msg.push('In questa categoria servono almeno due mescole diverse.');
  return msg;
}

/* ---------------- stato del costruttore ---------------- */
const TYN={S:'Morbida',M:'Media',H:'Dura',I:'Intermedia',W:'Bagnato'};
const PUSHN=['Gestisci','Standard','Spingi'];
const cp3=c=>({c:c.c.slice(),e:c.e.slice(),p:(c.p||c.c.map(()=>0)).slice()});
function bInit(w){
  if(w.b&&w.b.c)return w.b;
  let k=w.hint&&planOk(w.hint)&&w.hint!=='safe'&&w.hint!=='inter'?w.hint:(planOk('one')?'one':planKeys()[0]);
  const pre=tyPre(k);
  w.b={m:'b',pk:k,...cp3(pre)};
  return w.b;
}
function bPre(w,k){
  if(k==='safe'||k==='inter'){w.b={m:k,pk:k,c:['M'],e:[],p:[0]};return}
  const pre=tyPre(k);w.b={m:'b',pk:k,...cp3(pre)};
}
function bStops(w,n){
  const t=tyT(),T=tyLaps(),b=bInit(w);
  if(b.m!=='b'){bPre(w,'one');return bStops(w,n)}
  if(n<TY.stops[t][0]||n>TY.stops[t][1])return;
  const c=[],p=[];
  for(let j=0;j<=n;j++){c.push(b.c[j]||b.c[b.c.length-1]);p.push(b.p[j]||0)}
  /* con due soste o più non conviene ripetere la stessa mescola: alterna se serve */
  const e=[];for(let j=0;j<n;j++)e.push(Math.round(T*(j+1)/(n+1)));
  w.b={m:'b',pk:null,c,e,p};
  if(t>=2&&n>=1&&!c.some(x=>x!==c[0]))w.b.c[w.b.c.length-1]=TY.cps[t].find(x=>x!==c[0]);
}
const bCmpL=(t,j)=>TY.cps[t].concat(j===0&&planOk('inter')?['I']:[]);
function bCompound(w,j){
  const t=tyT(),b=bInit(w);
  if(b.m==='inter'){bPre(w,'one');return}
  if(b.m!=='b')return;
  const L=bCmpL(t,j),i=L.indexOf(b.c[j]),nx=L[(i+1)%L.length];
  if(nx==='I'){bPre(w,'inter');return}
  b.c[j]=nx;b.pk=null;
}
function bCompoundSet(w,j,c){
  const t=tyT(),b=bInit(w);
  if(c==='I'){bPre(w,'inter');return}
  if(b.m!=='b'){bPre(w,'one');return bCompoundSet(w,j,c)}
  if(!TY.cps[t].includes(c))return;
  b.c[j]=c;b.pk=null;
}
function bPit(w,j,dir){
  const t=tyT(),T=tyLaps(),b=bInit(w),n=b.c.length-1;
  if(b.m!=='b'||j>=n)return;
  const lo=(j?b.e[j-1]:0)+TY.min[t],hi=(j<n-1?b.e[j+1]:T)-TY.min[t];
  b.e[j]=clamp(b.e[j]+dir*TY.step[t],lo,hi);b.pk=null;
}
function bPush(w,j,v){
  const b=bInit(w);if(b.m!=='b')return;
  v=v==null||v===''?((b.p[j]||0)+2)%3-1:clamp(+v,-1,1);b.p[j]=v;b.pk=null;
}
/* ---------------- lettura degli stint per l'interfaccia ---------------- */
function bStints(w,b){
  const T=tyLaps(),n=b.c.length,out=[];let a=0;
  for(let j=0;j<n;j++){
    const e=j<n-1?b.e[j]:T,len=e-a,p=b.p[j]||0,es=tyEst(w,b.c[j],p);
    const st=len<=es[1]?0:len<=es[2]?1:2;
    out.push({j,c:b.c[j],a:a+1,e,len,p,L:es[0],lo:es[1],hi:es[2],st});
    a=e;
  }
  return out;
}
const sfmt=v=>(Math.round(v*10)/10).toFixed(1).replace('.',',');
const STN=['Gestita','Al limite','Oltre il limite'],STC=['green','amber','warn'];
function bBar(s,mx,g){
  const pc=v=>Math.max(0,Math.min(100,v/mx*100)).toFixed(1);
  const lo=pc(s.lo),hi=pc(s.hi),x=pc(s.len);
  return `<div class="tyb" aria-hidden="true"><i class="zg" style="width:${lo}%"></i><i class="za" style="left:${lo}%;width:${(hi-lo).toFixed(1)}%"></i><i class="zr" style="left:${hi}%"></i>${g!=null?`<u class="gh" style="left:${pc(g)}%"></u>`:''}<b class="tk ${STC[s.st]}" style="left:${x}%"></b></div>`;
}
const stars=v=>{const n=Math.max(1,Math.min(5,Math.round(v/20)));return '★'.repeat(n)+'☆'.repeat(5-n)};
const PUSHT=['gomma più lunga','ritmo e gomma bilanciati','ritmo più alto, gomma che cala'];
/* ---------------- il consiglio del muretto ---------------- */
function advOf(w){
  const k=w.hint;if(!k||!planOk(k))return null;
  const T=tyLaps(),t=tyT();
  if(k==='safe')return{k,m:'safe'};
  if(k==='inter')return{k,m:'inter'};
  const pre=tyPre(k),cfg=cp3(pre);
  const sh=w.hw==='early'?-1:w.hw==='late'?1:0;
  if(sh&&cfg.e.length)cfg.e[0]+=sh*Math.max(1,Math.round(T*.07));
  return{k,m:'b',cfg:tyOk(cfg).length?cp3(pre):cfg};
}
function advTxt(a,w){
  const T=tyLaps();
  if(a.m==='safe')return `Segui la strategia di <b>${esc(aiRvTeam(w))}</b>`;
  if(a.m==='inter')return 'Parti con le <b>Intermedie</b> e scommetti sulla pioggia';
  const c=a.cfg,n=c.c.length-1;
  const seq=c.c.map(x=>TYN[x]).join(' → ');
  const st=n===0?'Nessuna sosta':n===1?'1 sosta':n+' soste';
  return `<b>${st}</b> · ${seq}${n?` · sosta al giro <b>${c.e.join('</b> e <b>')}</b>`:''}`;
}
function advWhy(w,a){
  const p=[],kn=w.kn||{};
  if(kn.wear)p.push('usura '+DEGL[w.u]);
  if(kn.ovt)p.push('sorpassi '+OL[w.ovt].toLowerCase());
  if(kn.rain)p.push(w.rain?'pioggia in pista':'asciutto');else if(w.rp>=30)p.push('pioggia possibile ('+w.rp+'%)');
  if(kn.sc&&w.sc)p.push('safety car probabile');
  if(a.k==='under')p.push('conviene anticipare la sosta');else if(a.k==='over')p.push('conviene allungare lo stint');else if(a.k==='soft')p.push('si attacca con le morbide');
  return p.length?'Perché: '+p.join(', ')+'.':'Perché: lo dicono i dati raccolti finora.';
}
const advSame=(b,a)=>a&&b.m===a.m&&(a.m!=='b'||(JSON.stringify([b.c,b.e,b.p||b.c.map(()=>0)])===JSON.stringify([a.cfg.c,a.cfg.e,a.cfg.p])));
function advBox(w,b){
  const o=typeof sgOf==='function'&&S.teams&&!S.first?sgOf(S.teamRank):null;
  const nm=o?`${esc(o.nm)} <span class="sgs">${stars(o.v)}</span>`:'';
  const a=advOf(w);

  const cps=a&&a.m==='b'?a.cfg.c.map(cpb).join(''):a&&a.m==='inter'?cpb('I'):a&&a.m==='safe'?cpb('M'):'';
  const copy=planOk('safe')?`<button class="ghost sm${b.m==='safe'?' on':''}" data-act="bcopy">Copia i rivali</button>`:'';
  if(!a)return `<div class="adv"><div class="advh"><b>Il muretto</b>${nm?' · '+nm:''}</div><p class="advw">Questa volta non si sbilancia: mancano dati per un consiglio chiaro. Decidi tu${copy?', oppure segui i rivali':''}.</p>${copy?`<div class="advb">${copy}</div>`:''}</div>`;
  const same=advSame(b,a);
  return `<div class="adv"><div class="advh"><b>Il muretto consiglia</b>${nm?' · '+nm:''}${rel?`<small>${rel}</small>`:''}</div><div class="advp"><span class="cps">${cps}</span><span class="advt">${advTxt(a,w)}</span></div><p class="advw">${esc(advWhy(w,a))}</p><div class="advb">${same?'<span class="stt green">Piano attuale</span>':'<button class="go sm" data-act="badv">Usa il consiglio</button>'}${copy}</div></div>`;
}
/* confronto con la sosta dei rivali: undercut / overcut */
function rvNote(w,b){
  if(b.m!=='b'||!b.e.length)return '';
  if(!(w.kn&&w.kn.rv)||!w.rv)return '<p class="bsm">Non sai ancora cosa faranno i rivali: il consulto «Strateghi» te lo dice.</p>';
  const rp=w.rv==='safe'||w.rv==='inter'?null:tyPre(w.rv);
  if(!rp||!rp.e.length)return '';
  const d=rp.e[0]-b.e[0],tm=esc(aiRvTeam(w));
  if(d>=3)return `<p class="bsm">Ti fermi <b>${d} giri prima</b> di ${tm}: tentativo di <b>undercut</b>.</p>`;
  if(d<=-3)return `<p class="bsm">Ti fermi <b>${-d} giri dopo</b> ${tm}: tentativo di <b>overcut</b>.</p>`;
  return `<p class="bsm">Sosta in linea con ${tm} (giro ${rp.e[0]}).</p>`;
}
function bldView(w){
  const t=tyT(),T=tyLaps(),b=bInit(w);
  let body='',ok=true,msg='';
  const advH=advBox(w,b);
  if(b.m==='b'){
    const sts=bStints(w,b),mx=Math.max(T*.9,...sts.map(s=>s.hi*1.12));
    const stops=TY.stops[t];
    let seg='';for(let n=stops[0];n<=stops[1];n++)seg+=`<button class="${b.c.length-1===n?'on':''}" data-act="bst" data-v="${n}">${n===0?'Nessuna':n}<small>${n===0?'sosta':n===1?'sosta':'soste'}</small></button>`;
    const rows=sts.map(s=>{
      const last=s.j===sts.length-1;

/* =====================================================================
   v5 · T · Pioggia in gara, decisione live
   Quando il meteo cambia (anche in una gara partita all'asciutto) scegli
   TU il giro del cambio gomme, guardando il radar (sempre più affidabile
   avvicinandosi al momento) e cosa fanno i rivali. Ogni rivale decide in
   base al suo stratega e alla sua capacità sul bagnato; chi sbaglia il
   momento perde tempo, chi lo azzecca lo guadagna.
   Tutto deterministico (hash): ricaricare la pagina non cambia l'esito.
   ===================================================================== */
const RLST=[1,2,2,2];
const RLN={0:'gomme da bagnato',1:'intermedie',2:'slick'};
function rlWin(){
  const T=tyLaps(),st=RLST[tyT()],a=Math.max(2,Math.round(T*.34)),b=Math.max(a+st*3,Math.round(T*.66));
  return{T,st,a,b,n:Math.floor((b-a)/st)+1};
}
const rlKey=w=>S.year+'|'+S.round+'|'+(w.c||'')+'|rl';
const rlRi=w=>w.rain?(w.wx?w.wx.ri:0):(hu(rlKey(w)+'ri')<.4?1:0);
/* capacità sul bagnato di un pilota rivale (0..1) */
function rvWet(r){
  const R=S.rivals||[],av=R.length?R.reduce((a,x)=>a+x.skill,0)/R.length:70;
  return clamp(.5+(r.skill-av)/90+.2*hg('wet|'+r.n),0,1);
}
/* la mia capacità sul bagnato (-1..1) */
const rlWetMe=()=>clamp((((S.st&&S.st.tecnica)||55)-55)/35,-1,1);
/* verità nascosta: tipo di cambiamento e giro ideale */
function rlTruth(w){
  const W=rlWin(),key=rlKey(w);
  const rt=w.rain?((w.wx&&w.wx.rt)||'keep'):'arrive',ri=rlRi(w);
  const k=1+Math.floor(hu(key+'lc')*Math.max(1,W.n-3));
  const Lc=W.a+k*W.st;
  let Ls;
  if(rt==='stop')Ls=Math.min(W.a+(W.n-1)*W.st,Lc+W.st);
  else if(rt==='keep'){const idx=clamp(Math.round((4-(w.u==null?2:w.u))/4*(W.n-1)),0,W.n-1);Ls=W.a+idx*W.st}
  else Ls=Lc;
  return{rt,ri,Lc,Ls,W};
}
/* gomma giusta (indice di WXO: 0 bagnato, 1 intermedie, 2 slick) */
function rlBestTyre(w,tr){
  if(w.mixed)return 1;
  if(tr.rt==='arrive')return tr.ri?0:1;
  if(tr.rt==='worse')return tr.ri?0:1;
  if(tr.rt==='stop')return tr.ri?1:2;
  return tr.ri?0:1;
}
/* qualità del giro scelto: -1..1 (tardi costa di più quando arriva la pioggia, presto quando si asciuga) */
function rlQ(rt,lap,Ls,st){
  const e=(lap-Ls)/st;let pen;
  if(rt==='stop')pen=e<0?-e*1.5:e*.75;
  else if(rt==='keep')pen=Math.abs(e)*.9;
  else pen=e>0?e*1.35:-e*.8;
  return clamp(1.15-pen*.6,-1,1);
}
/* i rivali: ognuno decide il proprio giro e la propria gomma */
function rlRivals(w,tr){
  const W=tr.W,key=rlKey(w),best=rlBestTyre(w,tr),out=[];
  (S.rivals||[]).forEach(r=>{
    const sg=sgV(r.t)/100,wet=rvWet(r),sk=.5*sg+.5*wet;
    const sd=(.5+2.3*(1-sk))*W.st;
    let lap=tr.Ls+hg(key+'|'+r.n)*sd+(1-sk)*.4*W.st;
    lap=W.a+Math.round((lap-W.a)/W.st)*W.st;
    lap=clamp(lap,W.a,W.b+W.st);
    const ok=hu(key+'ty'+r.n)<.45+.5*sk;
    const ty=ok?best:[0,1,2].filter(x=>x!==best)[hsh(key+'tz'+r.n)%2];
    let q=rlQ(tr.rt,lap,tr.Ls,W.st);
    if(ty!==best)q-=.5;
    out.push({n:r.n,t:r.t,lap,ty,sk:Math.round(sk*100)/100,q:Math.round(q*100)/100});
  });
  return out;
}
/* stato della "finestra meteo" dentro S.rc (si ricrea da solo se manca: vecchi salvataggi) */
function rlEnsure(){
  const rc=S.rc,w=S.wk;
  if(!rc||!w)return null;
  if(rc.rl&&rc.rl.k===rlKey(w))return rc.rl;
  const tr=rlTruth(w),rv=rlRivals(w,tr);
  rc.rl={k:rlKey(w),lap:tr.W.a,pit:null,done:0,rt:tr.rt,ri:tr.ri,Lc:tr.Lc,Ls:tr.Ls,a:tr.W.a,b:tr.W.b,st:tr.W.st,T:tr.W.T,rv,best:rlBestTyre(w,tr),sur:w.rain?0:1};
  return rc.rl;
}
const rlLast=rl=>rl.lap>=rl.a+Math.floor((rl.b-rl.a)/rl.st)*rl.st;
/* radar: sempre più affidabile avvicinandosi al momento giusto */
function rlRadar(w,rl){
  const key=rlKey(w)+'|rd'+rl.lap;
  const prog=clamp((rl.lap-rl.a)/Math.max(1,(rl.Ls-rl.a)),0,1);
  let pr=.52+.34*prog+.05*rlWetMe();
  if(S.eng&&S.eng.k==='ana'&&(engTier()||0)>=1)pr+=.06;
  pr=clamp(pr,.45,.94);
  const right=hu(key)<pr;
  const all=['worse','stop','keep'],truth=rl.rt==='arrive'?'worse':rl.rt;
  const sg=right?truth:all.filter(x=>x!==truth)[hsh(key+'f')%2];
  const eta=Math.max(1,Math.round((rl.Lc-rl.lap)+(right?0:(hu(key+'e')<.5?-1:2)*rl.st)));
  let tx;
  if(sg==='worse')tx=rl.lap<rl.Lc?`Cella intensa in avvicinamento: tra circa ${eta} ${eta===1?'giro':'giri'}.`:'La cella è sopra la pista: piove più forte.';
  else if(sg==='stop')tx='Il fronte si sta allontanando: la pioggia calerà presto.';
  else tx='Il radar è stabile: nessuna variazione in vista.';
  return{tx,lb:pr<.65?'bassa':pr<.8?'media':'alta',pr,sg};
}
/* cosa vedi in pista adesso (si vede solo a cambiamento avvenuto) */
function rlTrack(rl){
  const ch=rl.rt==='keep'?false:(rl.lap>rl.Lc);
  if(rl.rt==='arrive'||rl.rt==='worse')return ch?(rl.ri?'Pioggia forte: l\'acqua si accumula sul rettilineo.':'Cominciano a cadere gocce fitte: l\'asfalto si scurisce.'):(rl.rt==='arrive'?'Pista asciutta, il cielo si sta coprendo.':'Pista bagnata, pioggia regolare.');
  if(rl.rt==='stop')return ch?'Si forma la traiettoria asciutta in curva.':'Pista bagnata, pioggia regolare.';
  return 'Pista bagnata, condizioni invariate.';
}
/* quanto tempo stai perdendo rispetto ai rivali migliori (visibile solo quando è già successo) */
function rlLose(rl){
  if(rl.rt==='keep')return 0;
  const late=rl.rt==='stop'?(rl.lap-rl.Ls)/rl.st:(rl.lap-rl.Lc)/rl.st;
  return Math.max(0,late)*.7;
}
function rlShown(w,rl){
  const P=typeof posNow==='function'?posNow():{},names=[P.an,P.bn].filter(Boolean);
  const top=(S.rivals||[]).slice().sort((x,y)=>S.teams[y.t].car-S.teams[x.t].car).map(r=>r.n);
  const ord=[];
  names.concat(top).forEach(n=>{if(!ord.includes(n)&&rl.rv.some(x=>x.n===n))ord.push(n)});
  return ord.slice(0,6).map(n=>rl.rv.find(x=>x.n===n));
}
function rlRivRow(w,rl,x){
  const pit=x.lap<=rl.lap&&x.lap<=rl.b;
  const kl=typeof sgKl==='function'?sgKl(x.t):0;
  const lab=kl>=1?(x.sk>=.68?'esperto':x.sk>=.45?'nella media':'incerto'):'';
  const st=pit?`<span class="rlp">Ai box · ${RLN[x.ty]} <small>(giro ${x.lap})</small></span>`:`<span class="rlo">In pista</span>`;
  return `<div class="rlr"><span class="rln">${dot(S.tier,x.t)}${esc(x.n)}${lab?`<small>${lab}</small>`:''}</span>${st}</div>`;
}
/* decisione: effetto del giro scelto */
function rlResolve(w,rl,i){
  rl.pit=rl.lap;rl.ty=i;
  const W={st:rl.st};
  const stay=rl.sur&&i===2;
  const q=stay?-.8:rlQ(rl.rt,rl.lap,rl.Ls,rl.st);
  const qb=rl.rv.reduce((a,x)=>a+x.q,0)/Math.max(1,rl.rv.length);
  const wm=rlWetMe();
  const dq=q-qb;
  const xd=dq*.7*(dq>0?1+.25*wm:1-.15*wm);
  rl.q=Math.round(q*100)/100;rl.qb=Math.round(qb*100)/100;rl.xd=Math.round(xd*100)/100;
  rl.rvd={};
  rl.rv.forEach(x=>{rl.rvd[x.n]=Math.round((x.q-qb)*.55*100)/100});
  rl.done=1;
  try{
    const srt=rl.rv.slice().sort((a,b)=>b.q-a.q),wr=srt[srt.length-1];
    w.rlr={pit:rl.pit,ty:i,rt:rl.rt,sur:rl.sur,Ls:rl.Ls,xd:rl.xd,q:rl.q,qb:rl.qb,verdict:rlVerdict(rl),best:srt.slice(0,2).map(x=>({n:x.n,t:x.t,lap:x.lap,ty:x.ty})),worst:wr?{n:wr.n,t:wr.t,lap:wr.lap}:null};
  }catch(e){}
  return xd;
}
function rlVerdict(rl){
  const e=(rl.pit-rl.Ls)/rl.st;
  if(rl.sur&&rl.ty===2)return 'Sei rimasto sulle slick: la pioggia è arrivata comunque.';
  if(Math.abs(e)<.5)return 'Momento perfetto.';
  if(rl.rt==='stop')return e<0?'Troppo presto: la pista era ancora bagnata.':'Un po\' tardi: i rivali più svelti erano già sulle slick.';
  if(rl.rt==='keep')return e<0?'Rientro anticipato: le gomme reggevano ancora.':'Rientro tardivo: le gomme erano già finite.';
  return e<0?'Rientrato in anticipo sulla pioggia.':'Rientrato quando i rivali erano già sotto l\'acqua.';
}
function rlRecap(){
  const rc=S.rc;

  return `<div class="chips"><span class="chip ${g}">${ico('cloud','fl')} Pioggia · giro ${rl.pit} · ${esc(rlVerdict(rl))} ${rng}</span></div>`;
}

  F.mover=fin.filter(r=>!r.me&&r.g&&r.g-r.pos>=6).sort((a,b)=>(b.g-b.pos)-(a.g-a.pos))[0]||null;
  F.fall=fin.filter(r=>!r.me&&r.g&&r.g<=6&&r.pos-r.g>=6).sort((a,b)=>(b.pos-b.g)-(a.pos-a.g))[0]||null;
  F.dnfs=rows.filter(r=>r.dnf&&!r.me&&r.g&&r.g<=10).sort((a,b)=>a.g-b.g);

/* ---------------- storie candidate ---------------- */
function mdCands(F){
  const C=[],me=F.me,L=F.L,w=F.w;
  /* il tuo weekend */
  {
    const gain=(me.g||me.pos)-me.pos;
    const base={win:9,pod:7,pts:4.5,none:3.8,dnf:6}[F.kind]||4;
    C.push({k:'me',sc:base+(F.kind!=='dnf'&&gain>=6?1.6:0)+(F.kind==='none'&&me.g&&me.pos-me.g>=5?1:0),gain});
  }
  if(F.win&&!F.win.me)C.push({k:'win',sc:6+(F.win.g>=6?2.2:0)+(F.win.g===1?0:0),r:F.win});
  if(F.mover&&F.mover!==F.win)C.push({k:'mover',sc:4+Math.min(3,(F.mover.g-F.mover.pos-5)*.5),r:F.mover});
  if(F.fall)C.push({k:'fall',sc:4.6,r:F.fall});
  if(F.dnfs.length)C.push({k:'dnf',sc:3.6+(F.dnfs[0].g<=3?2:0),r:F.dnfs[0]});
  if(w&&(w.rain||w.sur)){
    C.push({k:'rain',sc:6.4+(w.rlr?1.6:0),r:w.rlr||null});
  }
  /* strategie dei rivali (tabella post gara) */
  if(L.st&&L.st.ai&&L.st.ai.length){
    const good=L.st.ai.filter(a=>a.vd===0&&a.pos<=3)[0],bad=L.st.ai.filter(a=>a.vd>=2&&a.pos>=6&&(S.teams[a.t]?S.teams[a.t].car:0)>=(S.teams[S.teamRank]?S.teams[S.teamRank].car:0))[0];
    if(hu('mds|'+S.year+'|'+S.round)<.38){if(good)C.push({k:'strat',sc:5.6,r:good,ok:1});else if(bad)C.push({k:'strat',sc:5,r:bad,ok:0})}
  }
  /* campionato */
  if(F.champ.length>1&&S.round>=Math.ceil(S.total*.4)){
    const a=F.champ[0],b=F.champ[1],gap=a.pts-b.pts,avg=a.pts/Math.max(1,S.round);
    const close=gap<=avg*1.6;
    if(close||a.dd>0)C.push({k:'title',sc:close?5.8+(S.round>S.total*.75?1.2:0):4.6,a,b,gap,close,newLead:a.dd>0});
  }
  /* compagno di squadra */
  if(L.mate){
    const m=F.rows.find(r=>!r.me&&r.n===L.mate.n);
    if(m){
      const d=m.dnf||me.dnf?0:(m.pos-me.pos);
      if(me.dnf!==m.dnf||Math.abs(d)>=4)C.push({k:'mate',sc:4.4+Math.min(1.5,Math.abs(d)*.15),m,d});
    }
  }
  /* rivale */
  if(S.riv){
    const r=F.rows.find(x=>x.n===S.riv.n);
    if(r&&!r.me&&(r.dnf||me.dnf||Math.abs(r.pos-me.pos)<=2))C.push({k:'riv',sc:4.2+(Math.abs(r.pos-me.pos)<=1?1:0)+(S.md&&S.md.rvf>0?1.5:0),r});
  }
  return C;
}

/* ---------------- il turno dei media ---------------- */
function mdTurn(){
  const F=mdFacts();if(!F)return;
  const m=mdEnsure(),C=mdCands(F);if(!C.length)return;
  C.forEach(c=>{c.sc+=hu('mdn|'+S.year+'|'+S.round+'|'+c.k)*.8});
  const used={};
  const ras=JR.map(j=>{
    let best=null,bv=-9;
    C.forEach(c=>{
      const w=(MDW[j.id][c.k]||1)*(1-(used[c.k]||0)*.4)*(m.lk&&m.lk[j.id]===c.k?.72:1);
      const v=c.sc*w+hg('mdp|'+S.year+'|'+S.round+'|'+j.id+'|'+c.k)*.25;
      if(v>bv){bv=v;best=c}
    });
    used[best.k]=(used[best.k]||0)+1;m.lk=m.lk||{};m.lk[j.id]=best.k;
    const t=mdWrite(best,j,F);
    return{j:j.id,o:mdOut(j),n:j.n,k:best.k,h:t.h,x:t.x,tone:t.tone,sc:best.sc};
  });
  /* prima pagina: la storia col peso maggiore, raccontata dalla testata che le somiglia di più */
  const lead=C.slice().sort((a,b)=>b.sc-a.sc)[0];
  let lj=JR[0],lv=-9;
  JR.forEach(j=>{const v=(MDW[j.id][lead.k]||1)+hg('mdl|'+S.year+'|'+S.round+'|'+j.id)*.2;if(v>lv){lv=v;lj=j}});
  const lt=mdWrite(lead,lj,F);
  const rk=ras.map(r=>r.k),pad=C.filter(c=>c!==lead&&c.k!=='me'&&!rk.includes(c.k)).sort((a,b)=>b.sc-a.sc).slice(0,3).map(c=>{
    let jj=JR[0],vv=-9;JR.forEach(j=>{const v=(MDW[j.id][c.k]||1)+hg('mdq|'+S.year+'|'+S.round+'|'+j.id+'|'+c.k)*.2;if(v>vv){vv=v;jj=j}});
    const t=mdWrite(c,jj,F);return{k:c.k,o:mdOut(jj),n:jj.n,h:t.h,x:t.x,tone:t.tone};
  });
  const chron={y:S.year,w:S.round,c:F.c,tier:S.tier,lead:{k:lead.k,o:mdOut(lj),n:lj.n,h:lt.h,x:lt.x,tone:lt.tone,me:lead.k==='me'},ras,pad};
  m.last=chron;
  m.hist.unshift({y:S.year,w:S.round,c:F.c,k:lead.k,h:lt.h,o:mdOut(lj),me:lead.k==='me'});
  if(m.hist.length>14)m.hist.length=14;
  if(lead.sc>=7||(lead.k==='me'&&['win','dnf'].includes(F.kind))){
    m.ar.push({y:S.year,w:S.round,tier:S.tier,c:F.c,k:lead.k,h:lt.h,me:lead.k==='me',kind:F.kind,sc:Math.round(lead.sc*10)/10});
    if(m.ar.length>70)m.ar.splice(0,m.ar.length-70);
  }
  if(F.w&&(F.w.rain||F.w.sur)&&!F.me.dnf&&F.me.pos<=5)m.wet++;
  mdMemo(F);
  try{mdTurn2(F,{k:lead.k,sc:lead.sc,tone:lt.tone},lj)}catch(e){}
  S.last.md=chron;
}

const viewKey=()=>{try{
  if(!S)return 'home:'+(typeof VIEW==='string'?VIEW:'');
  const w=S.wk,rc=S.rc;
  return [S.phase,S.tab,S.year,S.round,S.step,rc&&rc.n,rc&&rc.ev,w&&w.ql&&w.ql.s,w&&w.ql&&w.ql.t,w&&w.a2,w&&w.ex&&w.ex.s,w&&!!w.grid].join('|');
}catch(e){return ''}};
{const _rd=render;render=function(){
  const k=viewKey();
  try{const a=document.getElementById('app');if(a&&a.classList)a.classList.toggle('noan',k!==''&&k===LASTK)}catch(e){}
  LASTK=k;
  try{return _rd.apply(this,arguments)}
  catch(e){
    try{console.error(e)}catch(_){}
    try{
      const app=document.getElementById('app');
      if(app)app.innerHTML='<section class="card"><div class="sech">Questa schermata non si apre</div><p class="sub">La carriera è salvata e al sicuro. Torna alla Home e riprendila: di solito basta questo.</p><div class="btns"><button class="go" data-act="home">Torna alla Home</button></div></section>';
    }catch(_){}
  }
}}

/* =====================================================================
   Obiettivi del weekend: l'etichetta (Alta / Media / Bassa / Remota) viene
   dalla previsione del motore di gara, non da una media griglia/vettura.
   Per ogni avversario si calcola la probabilità che ti passi; da lì si
   ricava la distribuzione del piazzamento. Cambia solo il numero mostrato.
   ===================================================================== */
const OBSG=[6,6,6,4];                     /* incertezza di gara per categoria, in unità di prestazione */
const OBAD=[9,9,9,8];                        /* vantaggio medio che le scelte in gara danno rispetto alla previsione neutra */
let OBOLD=false;                               /* la generazione delle carte usa ancora la stima di prima: così le carte e i premi non cambiano */
{const _og=obGen;obGen=function(){OBOLD=true;try{return _og.apply(this,arguments)}finally{OBOLD=false}}}
const OBDN=[.11,.09,.09,.066];
const OBMX=.3,OBMK=2.5;                         /* nel 30% dei casi la gara è più caotica (σ ×2,5): code lunghe delle probabilità */                  /* probabilità di ritiro per categoria */
function obDist(w){
  const svR=RNG,svN=NZX,svF=S._flash,hadF=Object.prototype.hasOwnProperty.call(S,'_flash');let E=null;
  RNG=mul32(777);PKK=true;NZX={m:0,r:{}};
  try{E=simulateRace({mod:1.1,risk:.02,sk:'ritmo',fx:{},out:''},PTS)}
  finally{PKK=false;NZX=svN;RNG=svR;if(hadF)S._flash=svF;else delete S._flash}
  const me=E.find(e=>e.me);if(!me)return null;
  const t=S.tier|0,sg1=OBSG[t]*Math.SQRT2,sg2=sg1*OBMK,ad=OBAD[t];
  const mine=me.perf+ad,rv=E.filter(e=>!e.me);
  const mk=sg=>{let d=[1];rv.forEach(e=>{const p=nCdf((e.perf-mine)/sg),n=new Array(d.length+1).fill(0);for(let k=0;k<d.length;k++){n[k]+=d[k]*(1-p);n[k+1]+=d[k]*p}d=n});return d};
  const d1=mk(sg1),d2=mk(sg2),d=d1.map((x,i)=>(1-OBMX)*x+OBMX*d2[i]);
  const ps=rv.map(e=>({n:e.n,p:(1-OBMX)*nCdf((e.perf-mine)/sg1)+OBMX*nCdf((e.perf-mine)/sg2)}));
  return{d,ps};
}
const obCum=(D,n)=>{let s=0;for(let k=0;k<Math.min(Math.max(0,n),D.d.length);k++)s+=D.d[k];return s};   /* P(arrivo ≤ n) */
/* Taratura finale (solo etichetta mostrata): ricalibrazione per tipo di obiettivo,
   misurata su ~27.000 obiettivi simulati; nelle serie minori un piccolo spostamento in più. */
const OBCAL={top:[.7,.15],pod:[.91,.19],rim:[.5,-.23],mate:[1.4,-1.04],pts:[.67,-1.25],win:[1.06,.85],riv:[1.23,-.63]};
function obCal(k,p,t){
  const c=OBCAL[k];if(!c||!(p>=0))return p;
  const q=clamp(p,.005,.995),x=Math.log(q/(1-q));
  let z=c[0]*x+c[1];if(t<3)z-=.3;
  return clamp(1/(1+Math.exp(-z)),.02,.98);
}
{const _op=obP;obP=function(o,w){
  if(OBOLD)return _op.apply(this,arguments);
  try{
    const r=obP0(o,w);
    if(r!=null&&o&&o.k!=='trk'&&isFinite(r))return obCal(o.k,r,S.tier|0);
    return r;
  }catch(e){}
  return _op.apply(this,arguments);
  function obP0(o,w){
  try{
    const D=obDist(w),t=S.tier|0,dn=OBDN[t],ok=1-dn;
    if(D&&o){
      const g=w&&w.gpx?w.gp:null,pl=o.plus==='pts'?10:99;
      switch(o.k){
        case 'top':return obCum(D,Math.min(o.n,pl))*ok;
        case 'pod':return obCum(D,3)*ok;
        case 'win':return obCum(D,1)*ok;
        case 'pts':return obCum(D,10)*ok;
        case 'rim':{if(g==null)break;const need=Math.min(o.n,Math.max(0,g-1));return obCum(D,Math.min(g-need,pl))*ok}
        case 'mate':case 'riv':{
          const x=D.ps.find(e=>e.n===o.nm);if(!x)break;
          const dr=.07;let p=(dr+(1-dr)*(1-x.p))*ok;
          if(o.plus==='pts')p=Math.min(p,obCum(D,10)*ok);
          return clamp(p,.02,.98);
        }
      }
    }
  }catch(e){}
  return _op.apply(this,arguments);
  }
}}
render();
document.addEventListener('click',e=>{if(VIBON&&e.target.closest('[data-act],.nv')&&navigator.vibrate)try{navigator.vibrate(8)}catch(_){}} ,true);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
